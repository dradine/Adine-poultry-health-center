<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#173f35"
>

<title>
    ثبت فارم
</title>

<link
    rel="stylesheet"
    href="app.css"
>

</head>


<body>

<header class="topbar">

    <div class="brand">

        <img
            src="IMG_4309.png"
            alt="آدینه"
        >

        <span>
            ثبت فارم
        </span>

    </div>

</header>


<main class="page">

<div class="container">

    <h1 class="page-title">
        ثبت و مدیریت فارم
    </h1>

    <p class="page-description">
        اطلاعات پایه فارم را وارد کنید.
    </p>


    <form
        id="farmForm"
        class="card"
    >

        <div class="form-grid">


            <div class="form-group">

                <label>
                    نام فارم
                </label>

                <input
                    id="farmName"
                    required
                    placeholder="مثلاً فارم شماره ۱"
                >

            </div>


            <div class="form-group">

                <label>
                    کد فارم
                </label>

                <input
                    id="farmCode"
                    placeholder="مثلاً F01"
                >

            </div>


            <div class="form-group">

                <label>
                    موقعیت
                </label>

                <input
                    id="farmLocation"
                    placeholder="شهر / منطقه"
                >

            </div>


            <div class="form-group">

                <label>
                    مالک
                </label>

                <input
                    id="farmOwner"
                >

            </div>


            <div class="form-group">

                <label>
                    مسئول فارم
                </label>

                <input
                    id="farmManager"
                >

            </div>


            <div class="form-group">

                <label>
                    ظرفیت کل
                </label>

                <input
                    id="farmCapacity"
                    type="number"
                    min="0"
                >

            </div>


            <div class="form-group full">

                <label>
                    توضیحات
                </label>

                <textarea
                    id="farmNotes"
                ></textarea>

            </div>

        </div>


        <div class="button-row">

            <button
                class="btn btn-primary"
                type="submit"
            >
                ذخیره فارم
            </button>

            <button
                class="btn btn-secondary"
                type="button"
                onclick="location.href='dashboard.html'"
            >
                بازگشت
            </button>

        </div>

    </form>


    <section class="card">

        <h2 class="card-title">
            فارم‌های ثبت‌شده
        </h2>

        <div id="farmsList">

            در حال بارگذاری...

        </div>

    </section>

</div>

</main>


<script src="standards.js"></script>
<script src="standard-data.js"></script>
<script src="poultry-utils.js"></script>
<script src="weekly-storage.js"></script>
<script src="comparison-engine.js"></script>
<script src="app-core.js"></script>
<script src="genetics-ui.js"></script>
<script src="weekly-engine.js"></script>


<script>

const farmForm =
    document.getElementById(
        "farmForm"
    );


farmForm.addEventListener(
    "submit",
    event => {

        event.preventDefault();


        const farm =
            saveFarm({

                name:
                    document.getElementById(
                        "farmName"
                    ).value,

                code:
                    document.getElementById(
                        "farmCode"
                    ).value,

                location:
                    document.getElementById(
                        "farmLocation"
                    ).value,

                owner:
                    document.getElementById(
                        "farmOwner"
                    ).value,

                manager:
                    document.getElementById(
                        "farmManager"
                    ).value,

                capacity:
                    document.getElementById(
                        "farmCapacity"
                    ).value,

                notes:
                    document.getElementById(
                        "farmNotes"
                    ).value

            });


        setCurrentSelection({

            farmId:
                farm.id

        });


        farmForm.reset();


        renderFarms();

    }
);


function renderFarms() {

    const container =
        document.getElementById(
            "farmsList"
        );


    const farms =
        getFarms();


    if (!farms.length) {

        container.innerHTML = `

            <p>
                هنوز فارمی ثبت نشده است.
            </p>

        `;

        return;

    }


    container.innerHTML = farms
        .map(
            farm => `

                <div class="card">

                    <strong>
                        ${escapeHTML(
                            farm.name
                        )}
                    </strong>

                    <p>
                        کد:
                        ${escapeHTML(
                            farm.code
                        )}
                    </p>

                    <p>
                        ظرفیت:
                        ${farm.capacity || "-"}
                    </p>

                    <div class="button-row">

                        <button
                            class="btn btn-primary"
                            onclick="
                                selectFarm(
                                    '${farm.id}'
                                )
                            "
                        >
                            انتخاب
                        </button>

                        <button
                            class="btn btn-danger"
                            onclick="
                                removeFarm(
                                    '${farm.id}'
                                )
                            "
                        >
                            حذف
                        </button>

                    </div>

                </div>

            `
        )
        .join("");

}


function selectFarm(
    id
) {

    setCurrentSelection({

        farmId:
            id

    });


    location.href =
        "flocks.html";

}


function removeFarm(
    id
) {

    if (
        !confirm(
            "آیا از حذف این فارم مطمئن هستید؟"
        )
    ) {

        return;

    }


    deleteFarm(
        id
    );


    renderFarms();

}


renderFarms();

</script>

</body>

</html>
