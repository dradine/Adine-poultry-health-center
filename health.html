<!doctype html>
<html lang="fa" dir="rtl">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>
پایش سلامت | مرکز تخصصی سلامت طیور آدینه
</title>

<link rel="stylesheet" href="Style.css">

<style>

/* =========================================================
   HEALTH PAGE
========================================================= */

.health-page {
    max-width: 1200px;
    margin: 0 auto;
    padding: 18px;
}

.health-header {
    margin-bottom: 18px;
}

.health-header h2 {
    margin: 0 0 8px;
}

.health-flock-info {
    background: #f4f7f9;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.8;
}

/* =========================================================
   TABS
========================================================= */

.health-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 15px;
}

.health-tab {
    border: 0;
    border-radius: 10px;
    padding: 13px 8px;
    cursor: pointer;
    background: #edf1f4;
    color: #333;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
}

.health-tab.active {
    background: #1f6f4a;
    color: white;
}

/* =========================================================
   PANELS
========================================================= */

.health-panel {
    display: none;
}

.health-panel.active {
    display: block;
}

.health-card {
    background: white;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
}

.health-card h3 {
    margin-top: 0;
}

/* =========================================================
   FORM
========================================================= */

.health-form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 12px;
}

.health-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.health-field.full {
    grid-column: 1 / -1;
}

.health-field label {
    font-weight: 700;
    font-size: 13px;
}

.health-field input,
.health-field select,
.health-field textarea {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #d7dde2;
    border-radius: 9px;
    padding: 11px;
    font-family: inherit;
    font-size: 14px;
    background: #fff;
}

.health-field textarea {
    min-height: 90px;
    resize: vertical;
}

.health-actions {
    margin-top: 16px;
    display: flex;
    gap: 10px;
}

.health-submit {
    border: 0;
    border-radius: 10px;
    padding: 12px 22px;
    background: #1f6f4a;
    color: white;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
}

.health-submit:disabled {
    opacity: .6;
    cursor: wait;
}

/* =========================================================
   JALALI DATE
========================================================= */

.jalali-date-wrap {
    position: relative;
}

.jalali-date-row {
    display: flex;
    gap: 6px;
}

.jalali-date-row input {
    flex: 1;
}

.jalali-calendar-btn {
    width: 46px;
    min-width: 46px;
    border: 1px solid #d7dde2;
    border-radius: 9px;
    background: #f7f8f9;
    cursor: pointer;
    font-size: 18px;
}

.jalali-calendar {
    position: absolute;
    z-index: 1000;
    top: calc(100% + 6px);
    right: 0;
    width: 300px;
    max-width: calc(100vw - 36px);
    background: white;
    border: 1px solid #ddd;
    border-radius: 14px;
    box-shadow: 0 10px 35px rgba(0,0,0,.15);
    padding: 12px;
    display: none;
}

.jalali-calendar.open {
    display: block;
}

.jalali-calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
}

.jalali-calendar-header button {
    border: 0;
    background: #edf1f4;
    border-radius: 8px;
    width: 34px;
    height: 34px;
    cursor: pointer;
}

.jalali-calendar-title {
    font-weight: 700;
}

.jalali-calendar-weekdays,
.jalali-calendar-days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
}

.jalali-calendar-weekdays div {
    text-align: center;
    font-size: 11px;
    color: #777;
    padding: 5px 0;
}

.jalali-calendar-days button {
    border: 0;
    background: transparent;
    border-radius: 7px;
    padding: 8px 0;
    cursor: pointer;
    font-family: inherit;
}

.jalali-calendar-days button:hover {
    background: #e9f4ee;
}

.jalali-calendar-days button.today {
    background: #1f6f4a;
    color: white;
    font-weight: bold;
}

/* =========================================================
   STATUS
========================================================= */

.health-status {
    display: none;
    margin-bottom: 15px;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
}

.health-status.success,
.health-status.error {
    display: block;
}

.health-status.success {
    background: #e7f6ed;
    color: #17643d;
}

.health-status.error {
    background: #fdeaea;
    color: #a02020;
}

/* =========================================================
   HISTORY
========================================================= */

.health-history {
    overflow-x: auto;
}

.health-history table {
    width: 100%;
    border-collapse: collapse;
    min-width: 750px;
}

.health-history th,
.health-history td {
    border-bottom: 1px solid #e5e8eb;
    padding: 10px;
    text-align: right;
    vertical-align: top;
}

.health-history th {
    background: #f5f7f8;
}

.health-badge {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 8px;
    background: #edf1f4;
    font-size: 12px;
    font-weight: 700;
}

.health-delete {
    border: 0;
    background: #b52b2b;
    color: white;
    border-radius: 7px;
    padding: 6px 10px;
    cursor: pointer;
    font-family: inherit;
}

.health-empty {
    text-align: center;
    padding: 25px;
    color: #777;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .health-page {
        padding: 12px;
    }

    .health-tabs {
        grid-template-columns: repeat(2, 1fr);
    }

    .health-form-grid {
        grid-template-columns: 1fr;
    }

    .health-field.full {
        grid-column: auto;
    }

    .health-card {
        padding: 14px;
    }

    .jalali-calendar {
        width: 280px;
    }

}

</style>

</head>


<body>


<header class="header">

    <img
        src="IMG_4309.png"
        class="header-logo"
        alt="مرکز تخصصی سلامت طیور آدینه"
    >

    <h1>
        مرکز تخصصی سلامت طیور آدینه
    </h1>

    <h3>
        پایش سلامت و مدیریت درمان
    </h3>

    <div class="user-row">

        <span id="userBox"></span>

        <button
            class="logout"
            data-logout
            type="button"
        >
            خروج
        </button>

    </div>

</header>


<nav class="menu">

    <a href="panel.html">🏠 داشبورد</a>
    <a href="flock.html">🐔 گله‌ها</a>
    <a href="feed.html">🌽 دان</a>
    <a href="water.html">💧 آب</a>
    <a href="vaccine.html">💉 واکسن</a>
    <a href="medicine.html">💊 دارو</a>
    <a href="health.html">🩺 سلامت</a>
    <a href="report.html">📊 گزارش</a>

</nav>


<main class="health-page">


    <div class="health-header">

        <h2>
            پایش سلامت گله
        </h2>

        <div
            id="flockInfo"
            class="health-flock-info"
        >
            در حال دریافت اطلاعات گله...
        </div>

    </div>


    <div
        id="healthStatus"
        class="health-status"
    ></div>


    <!-- =====================================================
         TABS
    ====================================================== -->

    <div class="health-tabs">

        <button
            type="button"
            class="health-tab active"
            data-tab="vaccination"
        >
            💉 واکسیناسیون
        </button>

        <button
            type="button"
            class="health-tab"
            data-tab="antibody"
        >
            🧪 تیتر آنتی‌بادی
        </button>

        <button
            type="button"
            class="health-tab"
            data-tab="lab"
        >
            🔬 آزمایش
        </button>

        <button
            type="button"
            class="health-tab"
            data-tab="treatment"
        >
            💊 ثبت درمان
        </button>

    </div>


    <!-- =====================================================
         VACCINATION
    ====================================================== -->

    <section
        id="panel-vaccination"
        class="health-panel active"
    >

        <div class="health-card">

            <h3>
                ثبت واکسیناسیون
            </h3>

            <form id="vaccinationForm">

                <div class="health-form-grid">


                    <div class="health-field">

                        <label>
                            تاریخ واکسیناسیون
                        </label>

                        <div class="jalali-date-wrap">

                            <div class="jalali-date-row">

                                <input
                                    id="vaccinationDate"
                                    type="text"
                                    inputmode="numeric"
                                    autocomplete="off"
                                    placeholder="۱۴۰۵/۰۵/۳۰"
                                    required
                                >

                                <button
                                    type="button"
                                    class="jalali-calendar-btn"
                                    data-calendar-for="vaccinationDate"
                                >
                                    📅
                                </button>

                            </div>

                            <div
                                class="jalali-calendar"
                                data-calendar="vaccinationDate"
                            ></div>

                        </div>

                    </div>


                    <div class="health-field">

                        <label>
                            بیماری هدف
                        </label>

                        <select
                            id="vaccinationDisease"
                        >
                            <option value="">
                                در حال بارگذاری...
                            </option>
                        </select>

                    </div>


                    <div class="health-field">

                        <label>
                            واکسن
                        </label>

                        <select
                            id="vaccinationVaccine"
                            required
                        >
                            <option value="">
                                در حال بارگذاری...
                            </option>
                        </select>

                    </div>


                    <div class="health-field">

                        <label>
                            شماره بچ
                        </label>

                        <input
                            id="vaccinationBatch"
                            type="text"
                        >

                    </div>


                    <div class="health-field">

                        <label>
                            روش مصرف
                        </label>

                        <select id="vaccinationRoute">

                            <option value="">
                                انتخاب کنید
                            </option>

                            <option value="water">
                                آب آشامیدنی
                            </option>

                            <option value="spray">
                                اسپری
                            </option>

                            <option value="eye">
                                قطره چشمی
                            </option>

                            <option value="wing">
                                بال‌زدن
                            </option>

                            <option value="injection">
                                تزریقی
                            </option>

                            <option value="feed">
                                دان
                            </option>

                            <option value="oral">
                                خوراکی
                            </option>

                            <option value="other">
                                سایر
                            </option>

                        </select>

                    </div>


                    <div class="health-field">

                        <label>
                            دوز
                        </label>

                        <input
                            id="vaccinationDose"
                            type="text"
                            inputmode="decimal"
                        >

                    </div>


                    <div class="health-field">

                        <label>
                            واحد دوز
                        </label>

                        <input
                            id="vaccinationDoseUnit"
                            type="text"
                            value="dose"
                        >

                    </div>


                    <div class="health-field">

                        <label>
                            انجام‌دهنده
                        </label>

                        <input
                            id="vaccinationAdministeredBy"
                            type="text"
                        >

                    </div>


                    <div class="health-field full">

                        <label>
                            توضیحات
                        </label>

                        <textarea
                            id="vaccinationNotes"
                        ></textarea>

                    </div>

                </div>


                <div class="health-actions">

                    <button
                        type="submit"
                        class="health-submit"
                    >
                        ثبت واکسیناسیون
                    </button>

                </div>

            </form>

        </div>

    </section>


    <!-- =====================================================
         ANTIBODY
    ====================================================== -->

    <section
        id="panel-antibody"
        class="health-panel"
    >

        <div class="health-card">

            <h3>
                ثبت تیتر آنتی‌بادی
            </h3>

            <form id="antibodyForm">

                <div class="health-form-grid">


                    <div class="health-field">

                        <label>
                            تاریخ آزمایش
                        </label>

                        <div class="jalali-date-wrap">

                            <div class="jalali-date-row">

                                <input
                                    id="antibodyDate"
                                    type="text"
                                    inputmode="numeric"
                                    autocomplete="off"
                                    placeholder="۱۴۰۵/۰۵/۳۰"
                                    required
                                >

                                <button
                                    type="button"
                                    class="jalali-calendar-btn"
                                    data-calendar-for="antibodyDate"
                                >
                                    📅
                                </button>

                            </div>

                            <div
                                class="jalali-calendar"
                                data-calendar="antibodyDate"
                            ></div>

                        </div>

                    </div>


                    <div class="health-field">

                        <label>
                            بیماری
                        </label>

                        <select id="antibodyDisease">
                            <option value="">
                                انتخاب کنید
                            </option>
                        </select>

                    </div>


                    <div class="health-field">

                        <label>
                            نوع آزمایش
                        </label>

                        <select id="antibodyTestType">

                            <option value="ELISA">
                                ELISA
                            </option>

                            <option value="HI">
                                HI
                            </option>

                            <option value="other">
                                سایر
                            </option>

                        </select>

                    </div>


                    <div class="health-field">

                        <label>
                            مرحله
                        </label>

                        <select id="antibodyStage">

                            <option value="">
                                انتخاب کنید
                            </option>

                            <option value="maternal">
                                تیتر مادری
                            </option>

                            <option value="pre_vaccination">
                                قبل واکسیناسیون
                            </option>

                            <option value="post_vaccination">
                                پس از واکسیناسیون
                            </option>

                            <option value="routine">
                                پایش روتین
                            </option>

                        </select>

                    </div>


                    <div class="health-field">

                        <label>
                            سن گله (روز)
                        </label>

                        <input
                            id="antibodyAge"
                            type="text"
                            inputmode="numeric"
                        >

                    </div>


                    <div class="health-field">

                        <label>
                            تعداد نمونه
                        </label>

                        <input
                            id="antibodySamples"
                            type="text"
                            inputmode="numeric"
                        >

                    </div>


                    <div class="health-field">

                        <label>
                            GMT
                        </label>

                        <input
                            id="antibodyGMT"
                            type="text"
                            inputmode="decimal"
                        >

                    </div>


                    <div class="health-field">

                        <label>
                            CV %
                        </label>

                        <input
                            id="antibodyCV"
                            type="text"
                            inputmode="decimal"
                        >

                    </div>


                    <div class="health-field">

                        <label>
                            حداقل
                        </label>

                        <input
                            id="antibodyMin"
                            type="text"
                            inputmode="decimal"
                        >

                    </div>


                    <div class="health-field">

                        <label>
                            حداکثر
                        </label>

                        <input
                            id="antibodyMax"
                            type="text"
                            inputmode="decimal"
                        >

                    </div>


                    <div class="health-field">

                        <label>
                            آزمایشگاه
                        </label>

                        <input
                            id="antibodyLab"
                            type="text"
                        >

                    </div>


                    <div class="health-field full">

                        <label>
                            توضیحات
                        </label>

                        <textarea
                            id="antibodyNotes"
                        ></textarea>

                    </div>

                </div>


                <div class="health-actions">

                    <button
                        type="submit"
                        class="health-submit"
                    >
                        ثبت تیتر
                    </button>

                </div>

            </form>

        </div>

    </section>


    <!-- =====================================================
         LAB
    ====================================================== -->

    <section
        id="panel-lab"
        class="health-panel"
    >

        <div class="health-card">

            <h3>
                ثبت آزمایش تشخیصی
            </h3>

            <form id="labForm">

                <div class="health-form-grid">


                    <div class="health-field">

                        <label>
                            تاریخ آزمایش
                        </label>

                        <div class="jalali-date-wrap">

                            <div class="jalali-date-row">

                                <input
                                    id="labDate"
                                    type="text"
                                    inputmode="numeric"
                                    autocomplete="off"
                                    placeholder="۱۴۰۵/۰۵/۳۰"
                                    required
                                >

                                <button
                                    type="button"
                                    class="jalali-calendar-btn"
                                    data-calendar-for="labDate"
                                >
                                    📅
                                </button>

                            </div>

                            <div
                                class="jalali-calendar"
                                data-calendar="labDate"
                            ></div>

                        </div>

                    </div>


                    <div class="health-field">

                        <label>
                            نوع آزمایش
                        </label>

                        <select id="labType" required>

                            <option value="">
                                انتخاب کنید
                            </option>

                            <option value="PCR">
                                PCR
                            </option>

                            <option value="ELISA">
                                ELISA
                            </option>

                            <option value="culture">
                                کشت
                            </option>

                            <option value="other">
                                سایر
                            </option>

                        </select>

                    </div>


                    <div class="health-field">

                        <label>
                            بیماری
                        </label>

                        <select id="labDisease">
                            <option value="">
                                انتخاب کنید
                            </option>
                        </select>

                    </div>


                    <div class="health-field">

                        <label>
                            نوع نمونه
                        </label>

                        <input
                            id="labSampleType"
                            type="text"
                        >

                    </div>


                    <div class="health-field">

                        <label>
                            تعداد نمونه
                        </label>

                        <input
                            id="labSampleCount"
                            type="text"
                            inputmode="numeric"
                        >

                    </div>


                    <div class="health-field">

                        <label>
                            تعداد مثبت
                        </label>

                        <input
                            id="labPositiveCount"
                            type="text"
                            inputmode="numeric"
                        >

                    </div>


                    <div class="health-field">

                        <label>
                            نتیجه
                        </label>

                        <input
                            id="labResult"
                            type="text"
                        >

                    </div>


                    <div class="health-field">

                        <label>
                            Ct
                        </label>

                        <input
                            id="labCT"
                            type="text"
                            inputmode="decimal"
                        >

                    </div>


                    <div class="health-field">

                        <label>
                            حساسیت آنتی‌بیوتیکی
                        </label>

                        <input
                            id="labSensitivity"
                            type="text"
                        >

                    </div>


                    <div class="health-field">

                        <label>
                            آزمایشگاه
                        </label>

                        <input
                            id="labLaboratory"
                            type="text"
                        >

                    </div>


                    <div class="health-field full">

                        <label>
                            توضیحات
                        </label>

                        <textarea
                            id="labNotes"
                        ></textarea>

                    </div>

                </div>


                <div class="health-actions">

                    <button
                        type="submit"
                        class="health-submit"
                    >
                        ثبت آزمایش
                    </button>

                </div>

            </form>

        </div>

    </section>


    <!-- =====================================================
         TREATMENT
    ====================================================== -->

    <section
        id="panel-treatment"
        class="health-panel"
    >

        <div class="health-card">

            <h3>
                ثبت درمان
            </h3>

            <form id="treatmentForm">

                <div class="health-form-grid">


                    <div class="health-field">

                        <label>
                            تاریخ شروع درمان
                        </label>

                        <div class="jalali-date-wrap">

                            <div class="jalali-date-row">

                                <input
                                    id="treatmentDate"
                                    type="text"
                                    inputmode="numeric"
                                    autocomplete="off"
                                    placeholder="۱۴۰۵/۰۵/۳۰"
                                    required
                                >

                                <button
                                    type="button"
                                    class="jalali-calendar-btn"
                                    data-calendar-for="treatmentDate"
                                >
                                    📅
                                </button>

                            </div>

                            <div
                                class="jalali-calendar"
                                data-calendar="treatmentDate"
                            ></div>

                        </div>

                    </div>


                    <div class="health-field">

                        <label>
                            تاریخ پایان درمان
                        </label>

                        <div class="jalali-date-wrap">

                            <div class="jalali-date-row">

                                <input
                                    id="treatmentEnd"
                                    type="text"
                                    inputmode="numeric"
                                    autocomplete="off"
                                    placeholder="اختیاری"
                                >

                                <button
                                    type="button"
                                    class="jalali-calendar-btn"
                                    data-calendar-for="treatmentEnd"
                                >
                                    📅
                                </button>

                            </div>

                            <div
                                class="jalali-calendar"
                                data-calendar="treatmentEnd"
                            ></div>

                        </div>

                    </div>


                    <div class="health-field">

                        <label>
                            دارو
                        </label>

                        <select id="treatmentMedication">

                            <option value="">
                                انتخاب دارو
                            </option>

                        </select>

                    </div>


                    <div class="health-field">

                        <label>
                            نام دارو
                        </label>

                        <input
                            id="treatmentMedicationName"
                            type="text"
                            required
                        >

                    </div>


                    <div class="health-field">

                        <label>
                            ماده مؤثره
                        </label>

                        <input
                            id="treatmentActive"
                            type="text"
                        >

                    </div>


                    <div class="health-field">

                        <label>
                            دوز
                        </label>

                        <input
                            id="treatmentDose"
                            type="text"
                            inputmode="decimal"
                        >

                    </div>


                    <div class="health-field">

                        <label>
                            روش مصرف
                        </label>

                        <select id="treatmentRoute">

                            <option value="">
                                انتخاب کنید
                            </option>

                            <option value="water">
                                آب آشامیدنی
                            </option>

                            <option value="oral">
                                خوراکی
                            </option>

                            <option value="feed">
                                دان
                            </option>

                            <option value="injection">
                                تزریقی
                            </option>

                            <option value="spray">
                                اسپری
                            </option>

                            <option value="other">
                                سایر
                            </option>

                        </select>

                    </div>


                    <div class="health-field">

                        <label>
                            علت / بیماری
                        </label>

                        <select id="treatmentDisease">

                            <option value="">
                                انتخاب کنید
                            </option>

                        </select>

                    </div>


                    <div class="health-field">

                        <label>
                            دوره منع مصرف (روز)
                        </label>

                        <input
                            id="treatmentWithdrawal"
                            type="text"
                            inputmode="numeric"
                        >

                    </div>


                    <div class="health-field full">

                        <label>
                            توضیحات درمان
                        </label>

                        <textarea
                            id="treatmentNotes"
                        ></textarea>

                    </div>

                </div>


                <div class="health-actions">

                    <button
                        type="submit"
                        class="health-submit"
                    >
                        ثبت درمان
                    </button>

                </div>

            </form>

        </div>

    </section>


    <!-- =====================================================
         HISTORY
    ====================================================== -->

    <section>

        <div class="health-card">

            <h3>
                سوابق سلامت گله
            </h3>

            <div class="health-history">

                <table>

                    <thead>

                        <tr>

                            <th>
                                تاریخ
                            </th>

                            <th>
                                نوع
                            </th>

                            <th>
                                مورد
                            </th>

                            <th>
                                جزئیات
                            </th>

                            <th>
                                عملیات
                            </th>

                        </tr>

                    </thead>

                    <tbody id="healthTable">

                        <tr>

                            <td
                                colspan="5"
                                class="health-empty"
                            >
                                در حال دریافت سوابق...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </section>


</main>

     REQUIRED PROJECT FILES
========================================================= -->

<script src="app.js"></script>

</body>
