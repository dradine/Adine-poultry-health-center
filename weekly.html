<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>
    ثبت هفتگی گله
</title>

<link
    rel="stylesheet"
    href="app.css"
>

</head>


<body>

<header class="topbar">

    <div class="brand">

        <img
            src="IMG_4309.png"
            alt="آدینه"
        >

        <span>
            پایش هفتگی
        </span>

    </div>

</header>


<main class="page">

<div class="container">


<h1 class="page-title">
    پایش هفتگی گله
</h1>


<p
    id="flockInfo"
    class="page-description"
></p>


<form
    id="weeklyForm"
    class="card"
>


<div class="form-grid">


<div class="form-group">

<label>
    هفته
</label>

<input
    id="week"
    type="number"
    min="1"
    required
>

</div>


<div class="form-group">

<label>
    تاریخ ارزیابی
</label>

<input
    id="evaluationDate"
    type="date"
    required
>

</div>


<div class="form-group">

<label>
    تعداد فعلی
</label>

<input
    id="birdCount"
    type="number"
    min="1"
    required
>

</div>


<div class="form-group">

<label>
    تلفات این هفته
</label>

<input
    id="mortality"
    type="number"
    min="0"
    value="0"
>

</div>


<div class="form-group">

<label>
    میانگین وزن (گرم)
</label>

<input
    id="averageWeight"
    type="number"
    step="0.1"
>

</div>


<div class="form-group">

<label>
    مصرف دان کل
</label>

<input
    id="feed"
    type="number"
    step="0.01"
>

</div>


<div class="form-group">

<label>
    مصرف آب کل
</label>

<input
    id="water"
    type="number"
    step="0.01"
>

</div>


<div class="form-group full">

<label>
    توضیحات
</label>

<textarea
    id="notes"
></textarea>

</div>


</div>


<div class="button-row">

<button
    type="submit"
    class="btn btn-primary"
>
    محاسبه و ذخیره
</button>

</div>

</form>


<section
    id="result"
    class="card"
    style="display:none"
>

<h2 class="card-title">
    نتیجه
</h2>


<div
    id="stats"
    class="stats-grid"
></div>


<div
    id="comparison"
    style="margin-top:20px"
></div>

</section>


<section class="card">

<h2 class="card-title">
    سوابق هفتگی
</h2>

<div class="table-wrapper">

<table class="data-table">

<thead>

<tr>

<th>
هفته
</th>

<th>
وزن
</th>

<th>
دان/پرنده
</th>

<th>
آب/پرنده
</th>

<th>
FCR
</th>

<th>
تلفات
</th>

<th>
عملیات
</th>

</tr>

</thead>

<tbody
id="weeklyTable"
></tbody>

</table>

</div>

</section>


</div>

</main>


<script src="standards.js"></script>
<script src="standard-data.js"></script>
<script src="poultry-utils.js"></script>
<script src="weekly-storage.js"></script>
<script src="comparison-engine.js"></script>
<script src="app-core.js"></script>
<script src="genetics-ui.js"></script>
<script src="weekly-engine.js"></script>


<script>

const selection =
    getCurrentSelection();


if (!selection.flockId) {

    location.href =
        "flocks.html";

}


const flock =
    getFlocks()
        .find(
            x =>
                x.id ===
                selection.flockId
        );


if (!flock) {

    location.href =
        "flocks.html";

}


const farm =
    getFarms()
        .find(
            x =>
                x.id ===
                flock.farmId
        );


document.getElementById(
    "flockInfo"
).textContent =

    `${farm?.name || ""} | ` +

    `${flock.flockName} | ` +

    `${flock.strain}`;


document.getElementById(
    "evaluationDate"
).value =
    todayISO();


const previousRecords =
    getFlockWeeklyRecords(
        flock.id
    );


const lastRecord =
    previousRecords.length
        ? previousRecords[
            previousRecords.length - 1
          ]
        : null;


document.getElementById(
    "week"
).value =
    lastRecord
        ? Number(lastRecord.week) + 1
        : 1;


document.getElementById(
    "birdCount"
).value =
    lastRecord
        ? lastRecord.birdCount -
          lastRecord.mortality

        : flock.birdCount;


document.getElementById(
    "weeklyForm"
).addEventListener(
    "submit",
    event => {

        event.preventDefault();


        const record =
            createWeeklyFlockRecord({

                farmId:
                    flock.farmId,

                houseId:
                    flock.houseId,

                flockId:
                    flock.id,

                week:
                    document.getElementById(
                        "week"
                    ).value,

                date:
                    document.getElementById(
                        "evaluationDate"
                    ).value,

                birdCount:
                    document.getElementById(
                        "birdCount"
                    ).value,

                mortality:
                    document.getElementById(
                        "mortality"
                    ).value,

                averageWeight:
                    document.getElementById(
                        "averageWeight"
                    ).value,

                feed:
                    document.getElementById(
                        "feed"
                    ).value,

                water:
                    document.getElementById(
                        "water"
                    ).value,

                notes:
                    document.getElementById(
                        "notes"
                    ).value

            });


        const calculated =
            calculateWeeklyRecord(
                record,
                lastRecord
            );


        saveWeeklyRecord(
            calculated
        );


        showResult(
            calculated
        );


        renderTable();

    }
);


/* =========================================================
   RESULT
   ========================================================= */

function showResult(
    record
) {

    document.getElementById(
        "result"
    ).style.display =
        "block";


    document.getElementById(
        "stats"
    ).innerHTML = `

        <div class="stat">

            <div class="stat-label">
                میانگین وزن
            </div>

            <div class="stat-value">
                ${record.averageWeight || "-"}
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                افزایش وزن
            </div>

            <div class="stat-value">
                ${record.weightGain ?? "-"}
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                دان/پرنده
            </div>

            <div class="stat-value">
                ${
                    roundNumber(
                        record.feedPerBird,
                        2
                    ) ?? "-"
                }
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                آب/پرنده
            </div>

            <div class="stat-value">
                ${
                    roundNumber(
                        record.waterPerBird,
                        2
                    ) ?? "-"
                }
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                آب به دان
            </div>

            <div class="stat-value">
                ${
                    roundNumber(
                        record.waterFeedRatio,
                        2
                    ) ?? "-"
                }
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                FCR
            </div>

            <div class="stat-value">
                ${
                    roundNumber(
                        record.fcr,
                        3
                    ) ?? "-"
                }
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                تلفات
            </div>

            <div class="stat-value">
                ${
                    roundNumber(
                        record.mortalityPercent,
                        2
                    ) ?? "-"
                }%
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                زنده‌مانی
            </div>

            <div class="stat-value">
                ${
                    roundNumber(
                        record.livability,
                        2
                    ) ?? "-"
                }%
            </div>

        </div>

    `;


    showStandardComparison(
        record
    );

}


/* =========================================================
   STANDARD COMPARISON
   ========================================================= */

function showStandardComparison(
    record
) {

    const box =
        document.getElementById(
            "comparison"
        );


    const age =
        Number(
            record.ageDays ||
            (
                Number(record.week) *
                7
            )
        );


    const standard =
        getWeeklyStandard({

            type:
                flock.productionType,

            genetics:
                flock.genetics,

            strain:
                flock.strain,

            program:
                flock.program,

            age

        });


    if (!standard) {

        box.innerHTML = `

            <div class="card">

                <strong>
                    استاندارد عددی هنوز وارد نشده است.
                </strong>

                <p>
                    اطلاعات عملکرد واقعی ذخیره شد.
                    پس از ورود کاتالوگ رسمی این گله
                    به‌صورت خودکار با استاندارد مقایسه خواهد شد.
                </p>

            </div>

        `;

        return;

    }


    const comparison =
        compareWeeklyRecord({

            record,

            standard

        });


    if (!comparison) {

        return;

    }


    box.innerHTML = `

        <div class="card">

            <h3>
                مقایسه با استاندارد
            </h3>

            <p>
                امتیاز کلی:
                <strong>
                    ${
                        roundNumber(
                            comparison.overall.score,
                            1
                        )
                    }
                </strong>
            </p>

        </div>

    `;

}


/* =========================================================
   TABLE
   ========================================================= */

function renderTable() {

    const tbody =
        document.getElementById(
            "weeklyTable"
        );


    const records =
        getFlockWeeklyRecords(
            flock.id
        );


    if (!records.length) {

        tbody.innerHTML = `

            <tr>

                <td colspan="7">
                    هنوز اطلاعاتی ثبت نشده است.
                </td>

            </tr>

        `;

        return;

    }


    tbody.innerHTML =
        records
            .map(
                record => `

                    <tr>

                        <td>
                            ${record.week}
                        </td>

                        <td>
                            ${record.averageWeight ?? "-"}
                        </td>

                        <td>
                            ${
                                roundNumber(
                                    record.feedPerBird,
                                    2
                                ) ?? "-"
                            }
                        </td>

                        <td>
                            ${
                                roundNumber(
                                    record.waterPerBird,
                                    2
                                ) ?? "-"
                            }
                        </td>

                        <td>
                            ${
                                roundNumber(
                                    record.fcr,
                                    3
                                ) ?? "-"
                            }
                        </td>

                        <td>
                            ${record.mortality}
                        </td>

                        <td>

                            <button
                                class="btn btn-danger"
                                onclick="
                                    deleteWeek(
                                        '${record.id}'
                                    )
                                "
                            >
                                حذف
                            </button>

                        </td>

                    </tr>

                `
            )
            .join("");

}


function deleteWeek(
    id
) {

    if (
        !confirm(
            "این رکورد حذف شود؟"
        )
    ) {

        return;

    }


    deleteWeeklyRecord(
        id
    );


    renderTable();

}


renderTable();

</script>

</body>

</html>
