<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#173f35"
    >

    <title>
        ثبت هفتگی | مرکز تخصصی سلامت طیور آدینه
    </title>

    <link
        rel="stylesheet"
        href="app.css"
    >

</head>


<body>

<div class="app-shell">


<header class="topbar">

    <div class="brand">

        <img
            src="IMG_4309.png"
            alt="مرکز تخصصی سلامت طیور آدینه"
        >

        <span>
            ثبت هفتگی
        </span>

    </div>


    <button
        class="btn btn-secondary"
        type="button"
        onclick="location.href='Dashboard.html'"
    >
        داشبورد
    </button>

</header>


<main class="page">

<div class="container">


<h1 class="page-title">
    پایش هفتگی گله
</h1>


<p class="page-description">
    ثبت وزن، یکنواختی، مصرف دان، آب و عملکرد هفتگی
</p>


<!-- CURRENT FLOCK -->

<section class="card">

<h2 class="card-title">
    گله انتخاب‌شده
</h2>

<div id="currentFlock">

    در حال بارگذاری...

</div>

</section>


<!-- WEEK -->

<section class="card">

<h2 class="card-title">
    اطلاعات هفته
</h2>


<div class="form-grid">


<div class="form-group">

<label for="weekNumber">
    هفته گله *
</label>

<input
    id="weekNumber"
    type="number"
    min="1"
    max="100"
    required
    inputmode="numeric"
    placeholder="مثلاً 4"
>

</div>


<div class="form-group">

<label for="evaluationDate">
    تاریخ ارزیابی
</label>

<input
    id="evaluationDate"
    type="date"
>

</div>


<div class="form-group">

<label for="liveBirds">
    تعداد زنده
</label>

<input
    id="liveBirds"
    type="number"
    min="0"
    inputmode="numeric"
>

</div>


<div class="form-group">

<label for="mortalityWeek">
    تلفات این هفته
</label>

<input
    id="mortalityWeek"
    type="number"
    min="0"
    inputmode="numeric"
>

</div>


</div>

</section>


<!-- WEIGHT -->

<section class="card">

<h2 class="card-title">
    ثبت وزن‌ها
</h2>


<p>
برای محاسبه دقیق، وزن تک‌تک پرندگان نمونه را وارد کنید.
</p>


<div class="button-row">

<button
    class="btn btn-primary"
    type="button"
    onclick="addWeightInput()"
>
    + افزودن وزن
</button>


<button
    class="btn btn-secondary"
    type="button"
    onclick="addTwentyWeights()"
>
    + افزودن ۲۰ وزن
</button>


<button
    class="btn btn-secondary"
    type="button"
    onclick="clearWeights()"
>
    پاک کردن
</button>

</div>


<div
    id="weightsContainer"
    class="weights-grid"
>

</div>


<div class="button-row">

<button
    class="btn btn-primary"
    type="button"
    onclick="calculateWeekly()"
>
    محاسبه
</button>

</div>

</section>


<!-- RESULTS -->

<section
    id="resultsCard"
    class="card"
    style="display:none;"
>

<h2 class="card-title">
    نتیجه محاسبات
</h2>


<div
    id="results"
    class="results-grid"
>

</div>


<div
    id="weightChartContainer"
    style="margin-top:20px;"
>

<canvas
    id="weightChart"
></canvas>

</div>

</section>


<!-- FEED / WATER -->

<section class="card">

<h2 class="card-title">
    مصرف دان و آب
</h2>


<div class="form-grid">


<div class="form-group">

<label for="feedTotal">
    کل دان مصرفی هفته (کیلوگرم)
</label>

<input
    id="feedTotal"
    type="number"
    min="0"
    step="0.01"
>

</div>


<div class="form-group">

<label for="waterTotal">
    کل آب مصرفی هفته (لیتر)
</label>

<input
    id="waterTotal"
    type="number"
    min="0"
    step="0.01"
>

</div>


<div class="form-group">

<label for="feedPerBird">
    دان روزانه هر پرنده (گرم)
</label>

<input
    id="feedPerBird"
    type="number"
    min="0"
    step="0.1"
>

</div>


<div class="form-group">

<label for="waterPerBird">
    آب روزانه هر پرنده (میلی‌لیتر)
</label>

<input
    id="waterPerBird"
    type="number"
    min="0"
    step="0.1"
>

</div>


</div>

</section>


<!-- NOTES -->

<section class="card">

<h2 class="card-title">
    یادداشت هفتگی
</h2>


<textarea
    id="weeklyNotes"
    rows="5"
    placeholder="کیفیت بستر، تهویه، آمونیاک، وضعیت مدفوع، مصرف، رفتار گله و سایر مشاهدات..."
></textarea>


<div class="button-row">

<button
    class="btn btn-primary"
    type="button"
    onclick="saveWeeklyRecord()"
>
    ذخیره گزارش هفتگی
</button>


<button
    class="btn btn-secondary"
    type="button"
    onclick="location.href='reports.html'"
>
    مشاهده گزارش‌ها
</button>

</div>

</section>


<!-- HISTORY -->

<section class="card">

<h2 class="card-title">
    سوابق ثبت‌شده
</h2>


<div id="weeklyHistory">

    در حال بارگذاری...

</div>

</section>


</div>

</main>


<nav class="bottom-nav">

<button
    type="button"
    onclick="location.href='Dashboard.html'"
>
    🏠
    <br>
    خانه
</button>


<button
    type="button"
    onclick="location.href='Farms.html'"
>
    🏭
    <br>
    فارم‌ها
</button>


<button
    class="active"
    type="button"
    onclick="location.href='weekly.html'"
>
    ⚖️
    <br>
    هفتگی
</button>


<button
    type="button"
    onclick="location.href='reports.html'"
>
    📊
    <br>
    گزارش
</button>

</nav>


</div>


<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script src="supabase-config.js"></script>

<script src="standards.js"></script>

<script src="standard-data.js"></script>

<script src="poultry-utils.js"></script>

<script src="weekly-storage.js"></script>

<script src="comparison-engine.js"></script>

<script src="app-core.js"></script>

<script src="genetics-ui.js"></script>

<script src="weekly-engine.js"></script>

<script src="weekly.js"></script>


</body>

</html>
