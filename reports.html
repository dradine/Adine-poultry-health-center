<!DOCTYPE html>

<main class="page">

<!-- =====================================================

<option value="pullet">

<div class="form-group">

<!-- =====================================================

===================================================== -->

<section class="card">

مقایسه وزن واقعی با استاندارد
</h2>

</div>

</section>


<!-- =====================================================
     CV
===================================================== -->

<section class="card">

<h2 class="card-title">
روند CV
</h2>


<div class="chart-box">

<canvas id="cvChart"></canvas>

</div>

</section>


<!-- =====================================================
     UNIFORMITY
===================================================== -->

<section class="card">

<h2 class="card-title">
روند یکنواختی
</h2>


<div class="chart-box">

<canvas id="uniformityChart"></canvas>

</div>

</section>


<!-- =====================================================
     FEED WATER
===================================================== -->

<section class="card">

<h2 class="card-title">
مصرف دان و آب
</h2>


<div class="chart-box">

<canvas id="feedWaterChart"></canvas>

</div>

</section>


<!-- =====================================================
     TABLE
===================================================== -->

<section class="card">

<h2 class="card-title">
جدول عملکرد هفتگی
</h2>


<div
    id="weeklyTable"
    style="overflow-x:auto"
>
</div>

</section>


</div>

</main>


<script src="supabase-config.js"></script>

<script src="app-core.js"></script>
<script src="standard-data.js"></script>
<script src="standards.js"></script>
<script src="poultry-utils.js"></script>
<script src="weekly-storage.js"></script>
<script src="comparison-engine.js"></script>
<script src="genetics-ui.js"></script>
<script src="weekly-engine.js"></script>

<script src="reports-data.js"></script>


<script>

"use strict";


/* =====================================================
   SELECTION
===================================================== */

const selection =
    getCurrentSelection();


if (!selection.flockId) {

    location.href =
        "records.html";

}


const flock =
    getFlocks()
        .find(
            item =>
                item.id ===
                selection.flockId
        );


if (!flock) {

    location.href =
        "records.html";

}


const farm =
    getFarms()
        .find(
            item =>
                item.id ===
                flock.farmId
        );


const house =
    getHouses()
        .find(
            item =>
                item.id ===
                flock.houseId
        );


document.getElementById(
    "flockInfo"
).textContent =

    `${farm?.name || "-"} | ` +
    `${house?.name || "-"} | ` +
    `${flock.flockName || "-"} | ` +
    `${flock.strain || "-"}`;


/* =====================================================
   SELECTORS
===================================================== */

const reportType =
    document.getElementById(
        "reportType"
    );


const reportGenetics =
    document.getElementById(
        "reportGenetics"
    );


const reportStrain =
    document.getElementById(
        "reportStrain"
    );


const standardStatus =
    document.getElementById(
        "standardStatus"
    );


/* =====================================================
   INITIAL VALUES
===================================================== */

reportType.value =
    flock.productionType || "";


/* =====================================================
   GENETICS
===================================================== */

function loadGenetics() {

    reportGenetics.innerHTML = `

        <option value="">
            انتخاب شرکت / ژنتیک
        </option>

    `;


    getGenetics(
        reportType.value
    )
    .forEach(
        genetics => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                genetics.id;


            option.textContent =
                genetics.name;


            reportGenetics.appendChild(
                option
            );

        }
    );


    if (
        flock.genetics
    ) {

        reportGenetics.value =
            flock.genetics;

    }


    loadStrains();

}


/* =====================================================
   STRAINS
===================================================== */

function loadStrains() {

    reportStrain.innerHTML = `

        <option value="">
            انتخاب سویه / نژاد
        </option>

    `;


    if (
        !reportType.value ||
        !reportGenetics.value
    ) {

        updateStandardStatus(
            null
        );

        return;

    }


    getStrains(
        reportType.value,
        reportGenetics.value
    )
    .forEach(
        strain => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                strain;


            option.textContent =
                strain;


            reportStrain.appendChild(
                option
            );

        }
    );


    if (
        flock.strain
    ) {

        const exists =
            [...reportStrain.options]
                .some(
                    option =>
                        option.value ===
                        flock.strain
                );


        if (exists) {

            reportStrain.value =
                flock.strain;

        }

    }


    updateStandard();

}


/* =====================================================
   STANDARD
===================================================== */

function getSelectedStandard() {

    if (
        !reportType.value ||
        !reportGenetics.value ||
        !reportStrain.value
    ) {

        return null;

    }


    return getStandard(
        reportType.value,
        reportGenetics.value,
        reportStrain.value
    );

}


/* =====================================================
   STATUS
===================================================== */

function updateStandardStatus(
    standard
) {

    if (!standard) {

        standardStatus.innerHTML = `

            <div class="info-box">

                برای انتخاب فعلی
                استاندارد عددی معتبر
                در سیستم ثبت نشده است.

                <br>

                هیچ عدد حدسی در نمودار
                یا محاسبات وارد نمی‌شود.

            </div>

        `;

        return;

    }


    standardStatus.innerHTML = `

        <div class="info-box">

            <strong>
                استاندارد فعال:
            </strong>

            ${escapeHTML(
                reportStrain.value
            )}

            <br>

            <small>

                منبع:
                ${escapeHTML(
                    standard.sourceStatus ||
                    "-"
                )}

                |

                سال:
                ${escapeHTML(
                    standard.sourceYear ||
                    "-"
                )}

            </small>

        </div>

    `;

}


/* =====================================================
   UPDATE STANDARD
===================================================== */

function updateStandard() {

    const standard =
        getSelectedStandard();


    updateStandardStatus(
        standard
    );


    renderAll();

}


/* =====================================================
   RECORDS
===================================================== */

function getRecords() {

    return getFlockWeeklyRecords(
        flock.id
    );

}


/* =====================================================
   STANDARD SERIES
===================================================== */

function getStandardSeries(
    standard,
    metric
) {

    if (!standard) {

        return [];

    }


    return getStandardSeriesSafe(
        standard,
        metric
    );

}


/*
    نام متفاوت برای جلوگیری از
    تداخل احتمالی با تابع standards.js
*/

function getStandardSeriesSafe(
    standard,
    metric
) {

    if (
        !standard ||
        !Array.isArray(
            standard.records
        )
    ) {

        return [];

    }


    return standard.records
        .filter(
            record =>
                record[metric] !==
                null &&
                record[metric] !==
                undefined
        )
        .map(
            record => ({

                ageDays:
                    Number(
                        record.ageDays
                    ),

                value:
                    Number(
                        record[metric]
                    )

            })
        );

}


/* =====================================================
   CHART INSTANCES
===================================================== */

let weightChart = null;

let cvChart = null;

let uniformityChart = null;

let feedWaterChart = null;


/* =====================================================
   DESTROY
===================================================== */

function destroyCharts() {

    [
        weightChart,
        cvChart,
        uniformityChart,
        feedWaterChart
    ]
    .forEach(
        chart => {

            if (chart) {

                chart.destroy();

            }

        }
    );


    weightChart = null;

    cvChart = null;

    uniformityChart = null;

    feedWaterChart = null;

}


/* =====================================================
   CHART DATA
===================================================== */

function createAgeLabels(
    records
) {

    return records.map(
        record =>
            `هفته ${
                Math.floor(
                    Number(
                        record.ageDays || 0
                    ) / 7
                )
            }`
    );

}


/* =====================================================
   WEIGHT CHART
===================================================== */

function renderWeightChart(
    records,
    standard
) {

    const labels =
        createAgeLabels(
            records
        );


    const actual =
        records.map(
            record =>
                record.averageWeight ===
                null
                    ? null
                    : Number(
                        record.averageWeight
                    )
        );


    const standardMap =
        new Map(
            getStandardSeries(
                standard,
                "bodyWeight"
            )
            .map(
                item =>
                    [
                        Number(
                            item.ageDays
                        ),
                        Number(
                            item.value
                        )
                    ]
            )
        );


    const standardValues =
        records.map(
            record =>
                standardMap.get(
                    Number(
                        record.ageDays
                    )
                ) ?? null
        );


    weightChart =
        new Chart(
            document.getElementById(
                "weightChart"
            ),
            {

                type: "line",

                data: {

                    labels,

                    datasets: [

                        {
                            label:
                                "وزن واقعی",

                            data:
                                actual,

                            tension:
                                0.25
                        },

                        {
                            label:
                                "استاندارد",

                            data:
                                standardValues,

                            tension:
                                0.25,

                            borderDash:
                                [7, 5]
                        }

                    ]

                },

                options: {

                    responsive:
                        true,

                    maintainAspectRatio:
                        false,

                    interaction: {

                        mode:
                            "index",

                        intersect:
                            false

                    }

                }

            }
        );

}


/* =====================================================
   CV
===================================================== */

function renderCVChart(
    records
) {

    const labels =
        createAgeLabels(
            records
        );


    const values =
        records.map(
            record =>
                record.cv === null
                    ? null
                    : Number(
                        record.cv
                    )
        );


    cvChart =
        new Chart(
            document.getElementById(
                "cvChart"
            ),
            {

                type: "line",

                data: {

                    labels,

                    datasets: [

                        {
                            label:
                                "CV %",

                            data:
                                values,

                            tension:
                                0.25

                        }

                    ]

                },

                options: {

                    responsive:
                        true,

                    maintainAspectRatio:
                        false,

                    scales: {

                        y: {

                            beginAtZero:
                                true

                        }

                    }

                }

            }
        );

}


/* =====================================================
   UNIFORMITY
===================================================== */

function renderUniformityChart(
    records
) {

    const labels =
        createAgeLabels(
            records
        );


    const u10 =
        records.map(
            record =>
                record.uniformity10 ===
                null
                    ? null
                    : Number(
                        record.uniformity10
                    )
        );


    const u15 =
        records.map(
            record =>
                record.uniformity15 ===
                null
                    ? null
                    : Number(
                        record.uniformity15
                    )
        );


    uniformityChart =
        new Chart(
            document.getElementById(
                "uniformityChart"
            ),
            {

                type: "line",

                data: {

                    labels,

                    datasets: [

                        {
                            label:
                                "یکنواختی ±10%",

                            data:
                                u10,

                            tension:
                                0.25

                        },

                        {
                            label:
                                "یکنواختی ±15%",

                            data:
                                u15,

                            tension:
                                0.25

                        }

                    ]

                },

                options: {

                    responsive:
                        true,

                    maintainAspectRatio:
                        false,

                    scales: {

                        y: {

                            min:
                                0,

                            max:
                                100

                        }

                    }

                }

            }
        );

}


/* =====================================================
   FEED / WATER
===================================================== */

function renderFeedWaterChart(
    records
) {

    const labels =
        createAgeLabels(
            records
        );


    const feed =
        records.map(
            record =>
                record.feed === null
                    ? null
                    : Number(
                        record.feed
                    )
        );


    const water =
        records.map(
            record =>
                record.water === null
                    ? null
                    : Number(
                        record.water
                    )
        );


    feedWaterChart =
        new Chart(
            document.getElementById(
                "feedWaterChart"
            ),
            {

                type: "line",

                data: {

                    labels,

                    datasets: [

                        {
                            label:
                                "دان",

                            data:
                                feed,

                            tension:
                                0.25

                        },

                        {
                            label:
                                "آب",

                            data:
                                water,

                            tension:
                                0.25

                        }

                    ]

                },

                options: {

                    responsive:
                        true,

                    maintainAspectRatio:
                        false

                }

            }
        );

}


/* =====================================================
   SUMMARY
===================================================== */

function renderSummary(
    records,
    standard
) {

    const box =
        document.getElementById(
            "summary"
        );


    if (!records.length) {

        box.innerHTML = `

            <div class="empty-state">

                هنوز اطلاعات هفتگی برای این گله
                ثبت نشده است.

            </div>

        `;

        return;

    }


    const last =
        records[
            records.length - 1
        ];


    const standardWeight =
        standard
            ? getStandardValueAtAge(
                standard,
                "bodyWeight",
                last.ageDays
            )
            : null;


    const difference =
        standardWeight === null
            ? null
            : Number(
                last.averageWeight
            ) -
            Number(
                standardWeight
            );


    box.innerHTML = `

        <div class="stat-card">

            <span>
                سن
            </span>

            <strong>
                ${formatNumber(
                    Number(
                        last.ageDays || 0
                    ) / 7,
                    1
                )}

                هفته
            </strong>

        </div>


        <div class="stat-card">

            <span>
                میانگین وزن
            </span>

            <strong>
                ${formatNumber(
                    last.averageWeight,
                    0
                )}

                گرم
            </strong>

        </div>


        <div class="stat-card">

            <span>
                CV
            </span>

            <strong>
                ${formatNumber(
                    last.cv,
                    1
                )}%
            </strong>

        </div>


        <div class="stat-card">

            <span>
                یکنواختی ±10%
            </span>

            <strong>
                ${formatNumber(
                    last.uniformity10,
                    1
                )}%
            </strong>

        </div>


        <div class="stat-card">

            <span>
                یکنواختی ±15%
            </span>

            <strong>
                ${formatNumber(
                    last.uniformity15,
                    1
                )}%
            </strong>

        </div>


        <div class="stat-card">

            <span>
                وزن استاندارد
            </span>

            <strong>

                ${
                    standardWeight === null
                        ? "—"
                        :
                        `${formatNumber(
                            standardWeight,
                            0
                        )} گرم`
                }

            </strong>

        </div>


        <div class="stat-card">

            <span>
                اختلاف با استاندارد
            </span>

            <strong>

                ${
                    difference === null
                        ? "—"
                        :
                        `${difference > 0 ? "+" : ""}
                        ${formatNumber(
                            difference,
                            0
                        )} گرم`
                }

            </strong>

        </div>


        <div class="stat-card">

            <span>
                FCR
            </span>

            <strong>
                ${formatNumber(
                    last.fcr,
                    2
                )}
            </strong>

        </div>

    `;

}


/* =====================================================
   TABLE
===================================================== */

function renderTable(
    records,
    standard
) {

    const box =
        document.getElementById(
            "weeklyTable"
        );


    if (!records.length) {

        box.innerHTML = `

            <div class="empty-state">
                رکوردی وجود ندارد.
            </div>

        `;

        return;

    }


    let html = `

        <table class="data-table">

            <thead>

                <tr>

                    <th>
                        هفته
                    </th>

                    <th>
                        وزن
                    </th>

                    <th>
                        استاندارد
                    </th>

                    <th>
                        اختلاف
                    </th>

                    <th>
                        CV
                    </th>

                    <th>
                        ±10%
                    </th>

                    <th>
                        ±15%
                    </th>

                    <th>
                        FCR
                    </th>

                    <th>
                        تلفات
                    </th>

                </tr>

            </thead>

            <tbody>
    `;


    records.forEach(
        record => {

            const standardWeight =
                standard
                    ? getStandardValueAtAge(
                        standard,
                        "bodyWeight",
                        record.ageDays
                    )
                    : null;


            const difference =
                standardWeight === null
                    ? null
                    : Number(
                        record.averageWeight
                    ) -
                    Number(
                        standardWeight
                    );


            html += `

                <tr>

                    <td>
                        ${formatNumber(
                            Number(
                                record.ageDays
                            ) / 7,
                            1
                        )}
                    </td>

                    <td>
                        ${formatNumber(
                            record.averageWeight,
                            0
                        )}
                    </td>

                    <td>
                        ${formatNumber(
                            standardWeight,
                            0
                        )}
                    </td>

                    <td>
                        ${
                            difference === null
                                ? "—"
                                :
                                `${
                                    difference > 0
                                        ? "+"
                                        : ""
                                }${formatNumber(
                                    difference,
                                    0
                                )}`
                        }
                    </td>

                    <td>
                        ${formatNumber(
                            record.cv,
                            1
                        )}%
                    </td>

                    <td>
                        ${formatNumber(
                            record.uniformity10,
                            1
                        )}%
                    </td>

                    <td>
                        ${formatNumber(
                            record.uniformity15,
                            1
                        )}%
                    </td>

                    <td>
                        ${formatNumber(
                            record.fcr,
                            2
                        )}
                    </td>

                    <td>
                        ${formatNumber(
                            record.mortality,
                            2
                        )}%
                    </td>

                </tr>

            `;

        }
    );


    html += `

            </tbody>

        </table>

    `;


    box.innerHTML =
        html;

}


/* =====================================================
   RENDER ALL
===================================================== */

function renderAll() {

    destroyCharts();


    const records =
        getRecords();


    const standard =
        getSelectedStandard();


    renderSummary(
        records,
        standard
    );


    renderTable(
        records,
        standard
    );


    renderWeightChart(
        records,
        standard
    );


    renderCVChart(
        records
    );


    renderUniformityChart(
        records
    );


    renderFeedWaterChart(
        records
    );

}


/* =====================================================
   EVENTS
===================================================== */

reportType.addEventListener(
    "change",
    function() {

        loadGenetics();

    }
);


reportGenetics.addEventListener(
    "change",
    function() {

        loadStrains();

    }
);


reportStrain.addEventListener(
    "change",
    function() {

        updateStandard();

    }
);


/* =====================================================
   START
===================================================== */

loadGenetics();

</script>


</body>

</html>
