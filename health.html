<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173f35">

<title>سلامت گله | مرکز تخصصی سلامت طیور آدینه</title>

<link rel="stylesheet" href="app.css">
</head>

<body>

<header class="topbar">

    <div class="brand">
        <img src="IMG_4309.png" alt="آدینه">
        <span>سلامت گله</span>
    </div>

    <button
        type="button"
        class="btn btn-secondary"
        onclick="location.href='Dashboard.html'">
        داشبورد
    </button>

</header>


<main class="page">

<div class="container">

<h1 class="page-title">
واکسیناسیون و دارو
</h1>

<p id="flockInfo" class="page-description"></p>


<!-- =====================================================
     VACCINATION
===================================================== -->

<section class="card">

<h2 class="card-title">
ثبت واکسیناسیون
</h2>

<form id="vaccineForm">

<div class="form-grid">

<div class="form-group">
<label>تاریخ</label>
<input id="vaccineDate" type="date" required>
</div>


<div class="form-group">
<label>سن گله (روز)</label>
<input id="vaccineAge" type="number" min="0">
</div>


<div class="form-group">
<label>بیماری / هدف</label>

<select id="vaccineDisease" required>

<option value="">انتخاب کنید</option>
<option value="ND">نیوکاسل</option>
<option value="IB">برونشیت عفونی</option>
<option value="IBD">گامبورو</option>
<option value="AI">آنفلوانزا</option>
<option value="ILT">لارنگوتراکئیت</option>
<option value="Marek">مارک</option>
<option value="Other">سایر</option>

</select>

</div>


<div class="form-group">
<label>نام واکسن</label>
<input id="vaccineName" required>
</div>


<div class="form-group">
<label>شرکت سازنده</label>
<input id="vaccineManufacturer">
</div>


<div class="form-group">
<label>روش مصرف</label>

<select id="vaccineRoute">

<option value="">انتخاب کنید</option>
<option value="water">آب آشامیدنی</option>
<option value="spray">اسپری</option>
<option value="eye">قطره چشمی</option>
<option value="wing">بال‌زدن</option>
<option value="injection">تزریقی</option>

</select>

</div>


<div class="form-group full">

<label>توضیحات</label>

<textarea id="vaccineNotes"></textarea>

</div>

</div>


<div class="button-row">

<button
    class="btn btn-primary"
    type="submit">
ثبت واکسیناسیون
</button>

</div>

</form>

</section>



<!-- =====================================================
     MEDICATION
===================================================== -->

<section class="card">

<h2 class="card-title">
ثبت دارو / درمان
</h2>

<form id="medicineForm">

<div class="form-grid">

<div class="form-group">
<label>تاریخ شروع</label>
<input id="medicineStart" type="date" required>
</div>


<div class="form-group">
<label>تاریخ پایان</label>
<input id="medicineEnd" type="date">
</div>


<div class="form-group">
<label>نام دارو</label>
<input id="medicineName" required>
</div>


<div class="form-group">
<label>ماده مؤثره</label>
<input id="medicineActive">
</div>


<div class="form-group">
<label>علت مصرف</label>
<input id="medicineReason">
</div>


<div class="form-group">
<label>روش مصرف</label>

<select id="medicineRoute">

<option value="">انتخاب کنید</option>
<option value="water">آب آشامیدنی</option>
<option value="feed">دان</option>
<option value="injection">تزریقی</option>
<option value="oral">خوراکی</option>
<option value="other">سایر</option>

</select>

</div>


<div class="form-group">
<label>مقدار مصرف</label>
<input id="medicineDose">
</div>


<div class="form-group">
<label>دوره مصرف</label>
<input id="medicineDuration">
</div>


<div class="form-group full">

<label>توضیحات</label>

<textarea id="medicineNotes"></textarea>

</div>

</div>


<div class="button-row">

<button
    class="btn btn-primary"
    type="submit">
ثبت درمان
</button>

</div>

</form>

</section>



<!-- =====================================================
     HISTORY
===================================================== -->

<section class="card">

<h2 class="card-title">
سوابق سلامت
</h2>

<div class="table-wrapper">

<table class="data-table">

<thead>

<tr>

<th>تاریخ</th>
<th>نوع</th>
<th>مورد</th>
<th>توضیح</th>
<th>حذف</th>

</tr>

</thead>

<tbody id="healthTable"></tbody>

</table>

</div>

</section>

</div>

</main>


<script src="app-core.js"></script>
<script src="standard-data.js"></script>
<script src="standards.js"></script>
<script src="poultry-utils.js"></script>
<script src="weekly-storage.js"></script>
<script src="comparison-engine.js"></script>
<script src="genetics-ui.js"></script>
<script src="weekly-engine.js"></script>


<script>

const selection = getCurrentSelection();

if (!selection.flockId) {
    location.href = "flocks.html";
}


const flock =
    getFlocks().find(
        item => item.id === selection.flockId
    );


if (!flock) {
    location.href = "flocks.html";
}


const farm =
    getFarms().find(
        item => item.id === flock.farmId
    );


const house =
    getHouses().find(
        item => item.id === flock.houseId
    );


document.getElementById("flockInfo").textContent =
    `${farm?.name || ""} | ${house?.name || ""} | ${flock.flockName} | ${flock.strain || ""}`;


document.getElementById("vaccineDate").value = todayISO();
document.getElementById("medicineStart").value = todayISO();



/* =====================================================
   STORAGE
===================================================== */

function getHealthRecords() {

    return readStorage(
        "health_records",
        []
    );

}


function saveHealthRecord(record) {

    const records = getHealthRecords();

    records.push({

        id: createId("health"),

        farmId: flock.farmId,
        houseId: flock.houseId,
        flockId: flock.id,

        ...record,

        createdAt: new Date().toISOString()

    });

    writeStorage(
        "health_records",
        records
    );

}


function deleteHealthRecord(id) {

    const records =
        getHealthRecords()
            .filter(
                item => item.id !== id
            );

    writeStorage(
        "health_records",
        records
    );

    renderHealth();

}



/* =====================================================
   VACCINE
===================================================== */

document.getElementById(
    "vaccineForm"
).addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        saveHealthRecord({

            type: "vaccination",

            date:
                document.getElementById(
                    "vaccineDate"
                ).value,

            age:
                Number(
                    document.getElementById(
                        "vaccineAge"
                    ).value || 0
                ),

            disease:
                document.getElementById(
                    "vaccineDisease"
                ).value,

            name:
                document.getElementById(
                    "vaccineName"
                ).value,

            manufacturer:
                document.getElementById(
                    "vaccineManufacturer"
                ).value,

            route:
                document.getElementById(
                    "vaccineRoute"
                ).value,

            notes:
                document.getElementById(
                    "vaccineNotes"
                ).value

        });

        this.reset();

        document.getElementById(
            "vaccineDate"
        ).value = todayISO();

        renderHealth();

        alert("رکورد واکسیناسیون ثبت شد.");

    }
);



/* =====================================================
   MEDICINE
===================================================== */

document.getElementById(
    "medicineForm"
).addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        saveHealthRecord({

            type: "medicine",

            date:
                document.getElementById(
                    "medicineStart"
                ).value,

            endDate:
                document.getElementById(
                    "medicineEnd"
                ).value,

            name:
                document.getElementById(
                    "medicineName"
                ).value,

            active:
                document.getElementById(
                    "medicineActive"
                ).value,

            reason:
                document.getElementById(
                    "medicineReason"
                ).value,

            route:
                document.getElementById(
                    "medicineRoute"
                ).value,

            dose:
                document.getElementById(
                    "medicineDose"
                ).value,

            duration:
                document.getElementById(
                    "medicineDuration"
                ).value,

            notes:
                document.getElementById(
                    "medicineNotes"
                ).value

        });

        this.reset();

        document.getElementById(
            "medicineStart"
        ).value = todayISO();

        renderHealth();

        alert("رکورد درمان ثبت شد.");

    }
);



/* =====================================================
   RENDER
===================================================== */

function renderHealth() {

    const table =
        document.getElementById(
            "healthTable"
        );


    const records =
        getHealthRecords()
            .filter(
                item =>
                    item.flockId === flock.id
            )
            .sort(
                (a,b) =>
                    b.date.localeCompare(a.date)
            );


    if (!records.length) {

        table.innerHTML = `

            <tr>
                <td colspan="5">
                    هنوز رکوردی ثبت نشده است.
                </td>
            </tr>

        `;

        return;
    }


    table.innerHTML =
        records
            .map(record => {

                const type =
                    record.type === "vaccination"
                        ? "واکسیناسیون"
                        : "دارو / درمان";


                const item =
                    record.name || "-";


                const note =
                    record.type === "vaccination"
                        ? (
                            record.disease ||
                            record.notes ||
                            "-"
                        )
                        : (
                            record.reason ||
                            record.notes ||
                            "-"
                        );


                return `

                    <tr>

                        <td>
                            ${escapeHTML(record.date)}
                        </td>

                        <td>
                            ${type}
                        </td>

                        <td>
                            ${escapeHTML(item)}
                        </td>

                        <td>
                            ${escapeHTML(note)}
                        </td>

                        <td>

                            <button
                                type="button"
                                class="btn btn-danger"
                                onclick="
                                    deleteHealthRecord(
                                        '${record.id}'
                                    )
                                "
                            >
                                حذف
                            </button>

                        </td>

                    </tr>

                `;

            })
            .join("");

}


renderHealth();

</script>

</body>
</html>
