        /* =====================================================
           تقویم شمسی
        ===================================================== */

        .jalali-date-wrapper {
            position: relative;
            width: 100%;
        }

        #evaluationDate {
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
            padding-left: 48px;
        }

        .jalali-calendar-button {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            font-size: 21px;
            cursor: pointer;
            z-index: 2;
        }

        .jalali-calendar {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: min(100%, 360px);
            background: #fff;
            border: 1px solid #e3e3e3;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0,0,0,.18);
            overflow: hidden;
            z-index: 9999;
            direction: rtl;
        }

        .jalali-calendar-header {

            color: #fff;

<!-- =====================================================
     یک تقویم شمسی - بدون کتابخانه خارجی
====================================================== -->

<script>

(function () {

    "use strict";

    let calendarYear = 0;
    let calendarMonth = 0;

    const monthNames = [
        "فروردین",
        "اردیبهشت",
        "خرداد",
        "تیر",
        "مرداد",
        "شهریور",
        "مهر",
        "آبان",
        "آذر",
        "دی",
        "بهمن",
        "اسفند"
    ];


    /*
     * تبدیل اعداد فارسی و عربی به انگلیسی
     * برای محاسبات و ذخیره‌سازی
     */

    function normalizeDigits(value) {

        return String(value ?? "")
            .replace(/[۰-۹]/g, function (d) {
                return String(
                    d.charCodeAt(0) - 1776
                );
            })
            .replace(/[٠-٩]/g, function (d) {
                return String(
                    d.charCodeAt(0) - 1632
                );
            });

    }


    /*
     * فقط برای نمایش
     */

    function toPersianDigits(value) {

        return String(value)
            .replace(/\d/g, function (d) {
                return "۰۱۲۳۴۵۶۷۸۹"[Number(d)];
            });

    }


    /*
     * امروز به تقویم شمسی
     * بدون نیاز به persianDate
     */

    function getTodayJalali() {

        const now = new Date();

        const formatter =
            new Intl.DateTimeFormat(
                "en-US-u-ca-persian",
                {
                    year: "numeric",
                    month: "numeric",
                    day: "numeric"
                }
            );

        const parts =
            formatter.formatToParts(now);


        const get =
            function (type) {

                const item =
                    parts.find(
                        p => p.type === type
                    );

                return item
                    ? Number(
                        normalizeDigits(
                            item.value
                        )
                    )
                    : 0;

            };


        return {

            year: get("year"),
            month: get("month"),
            day: get("day")

        };

    }


    /*
     * طول ماه
     */

    function jalaliMonthLength(
        year,
        month
    ) {

        if (month <= 6) {
            return 31;
        }

        if (month <= 11) {
            return 30;
        }


        /*
         * برای اسفند، با استفاده از فاصله
         * اول فروردین سال بعد و اول فروردین امسال
         */

        const current =
            jalaliToGregorian(
                year,
                1,
                1
            );

        const next =
            jalaliToGregorian(
                year + 1,
                1,
                1
            );


        const diff =
            Math.round(
                (
                    new Date(
                        next.gy,
                        next.gm - 1,
                        next.gd
                    ).getTime()
                    -
                    new Date(
                        current.gy,
                        current.gm - 1,
                        current.gd
                    ).getTime()
                )
                /
                86400000
            );


        return diff >= 366
            ? 30
            : 29;

    }


    /*
     * تبدیل جلالی به میلادی
     *
     * این تابع برای تعیین روز هفته
     * استفاده می‌شود.
     */

    function jalaliToGregorian(
        jy,
        jm,
        jd
    ) {

        let jy2 = jy;

        let days =
            -355668
            +
            365 * jy2
            +
            Math.floor(
                jy2 / 33
            ) * 8
            +
            Math.floor(
                (
                    (jy2 % 33) + 3
                ) / 4
            )
            +
            jd;


        if (jm <= 6) {

            days +=
                (jm - 1) * 31;

        } else {

            days +=
                186 +
                (jm - 7) * 30;

        }


        let gy =
            400 *
            Math.floor(
                days / 146097
            );


        days %= 146097;


        if (days > 36524) {

            gy +=
                100 *
                Math.floor(
                    --days / 36524
                );

            days %= 36524;

            if (days >= 365) {
                days++;
            }

        }


        gy +=
            4 *
            Math.floor(
                days / 1461
            );


        days %= 1461;


        if (days > 365) {

            gy +=
                Math.floor(
                    (days - 1) / 365
                );

            days =
                (days - 1) % 365;

        }


        let gd =
            days + 1;


        const leap =
            (
                gy % 4 === 0 &&
                gy % 100 !== 0
            )
            ||
            gy % 400 === 0;


        const monthDays = [
            31,
            leap ? 29 : 28,
            31,
            30,
            31,
            30,
            31,
            31,
            30,
            31,
            30,
            31
        ];


        let gm = 1;


        while (
            gm <= 12 &&
            gd > monthDays[gm - 1]
        ) {

            gd -=
                monthDays[gm - 1];

            gm++;

        }


        return {
            gy: gy,
            gm: gm,
            gd: gd
        };

    }


    /*
     * روز اول ماه
     *
     * شنبه = 0
     */

    function getFirstDay(
        year,
        month
    ) {

        const g =
            jalaliToGregorian(
                year,
                month,
                1
            );


        const date =
            new Date(
                g.gy,
                g.gm - 1,
                g.gd
            );


        /*
         * JS:
         * Sunday = 0
         * Saturday = 6
         *
         * تبدیل:
         * Saturday -> 0
         * Sunday -> 1
         */

        return (
            date.getDay() + 1
        ) % 7;

    }


    /*
     * نمایش تقویم
     */

    function renderCalendar() {

        const daysContainer =
            document.getElementById(
                "jalaliDays"
            );

        const title =
            document.getElementById(
                "jalaliMonthTitle"
            );


        if (
            !daysContainer ||
            !title
        ) {

            return;

        }


        title.textContent =
            monthNames[
                calendarMonth - 1
            ]
            +
            " "
            +
            toPersianDigits(
                calendarYear
            );


        daysContainer.innerHTML = "";


        const firstDay =
            getFirstDay(
                calendarYear,
                calendarMonth
            );


        for (
            let i = 0;
            i < firstDay;
            i++
        ) {

            const empty =
                document.createElement(
                    "div"
                );

            empty.className =
                "jalali-day empty";

            daysContainer.appendChild(
                empty
            );

        }


        const totalDays =
            jalaliMonthLength(
                calendarYear,
                calendarMonth
            );


        const input =
            document.getElementById(
                "evaluationDate"
            );


        const value =
            normalizeDigits(
                input?.dataset?.value ||
                ""
            );


        const selected =
            value.split("/");


        const selectedYear =
            Number(selected[0]);


        const selectedMonth =
            Number(selected[1]);


        const selectedDay =
            Number(selected[2]);


        const today =
            getTodayJalali();


        for (
            let day = 1;
            day <= totalDays;
            day++
        ) {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "jalali-day";


            button.textContent =
                toPersianDigits(
                    day
                );


            if (
                today.year === calendarYear &&
                today.month === calendarMonth &&
                today.day === day
            ) {

                button.classList.add(
                    "today"
                );

            }


            if (
                selectedYear === calendarYear &&
                selectedMonth === calendarMonth &&
                selectedDay === day
            ) {

                button.classList.add(
                    "selected"
                );

            }


            button.addEventListener(
                "click",
                function (event) {

                    event.preventDefault();
                    event.stopPropagation();


                    selectJalaliDate(
                        calendarYear,
                        calendarMonth,
                        day
                    );

                }
            );


            daysContainer.appendChild(
                button
            );

        }

    }


    /*
     * انتخاب تاریخ
     *
     * نکته مهم:
     *
     * value برای نمایش فارسی است.
     *
     * dataset.value برای ذخیره و پردازش
     * با اعداد انگلیسی نگه داشته می‌شود.
     */

    function selectJalaliDate(
        year,
        month,
        day
    ) {

        const input =
            document.getElementById(
                "evaluationDate"
            );


        if (!input) {
            return;
        }


        const normalized =
            String(year)
            +
            "/"
            +
            String(month).padStart(2, "0")
            +
            "/"
            +
            String(day).padStart(2, "0");


        input.dataset.value =
            normalized;


        input.value =
            toPersianDigits(
                normalized
            );


        closeCalendar();

    }


    /*
     * باز کردن
     */

    window.toggleJalaliCalendar =
        function (event) {

            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }


            const calendar =
                document.getElementById(
                    "jalaliCalendar"
                );


            if (!calendar) {
                return;
            }


            if (
                calendar.style.display ===
                "block"
            ) {

                closeCalendar();

                return;

            }


            const input =
                document.getElementById(
                    "evaluationDate"
                );


            const stored =
                normalizeDigits(
                    input?.dataset?.value ||
                    ""
                );


            const parts =
                stored.split("/");


            if (
                parts.length === 3 &&
                Number(parts[0]) &&
                Number(parts[1])
            ) {

                calendarYear =
                    Number(parts[0]);

                calendarMonth =
                    Number(parts[1]);

            } else {

                const today =
                    getTodayJalali();


                calendarYear =
                    today.year;

                calendarMonth =
                    today.month;

            }


            renderCalendar();


            calendar.style.display =
                "block";

        };


    /*
     * ماه قبل
     */

    window.jalaliPreviousMonth =
        function (event) {

            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }


            calendarMonth--;


            if (
                calendarMonth < 1
            ) {

                calendarMonth = 12;
                calendarYear--;

            }


            renderCalendar();

        };


    /*
     * ماه بعد
     */

    window.jalaliNextMonth =
        function (event) {

            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }


            calendarMonth++;


            if (
                calendarMonth > 12
            ) {

                calendarMonth = 1;
                calendarYear++;

            }


            renderCalendar();

        };


    /*
     * امروز
     */

    window.jalaliToday =
        function (event) {

            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }


            const today =
                getTodayJalali();


            selectJalaliDate(
                today.year,
                today.month,
                today.day
            );

        };


    /*
     * بستن
     */

    function closeCalendar() {

        const calendar =
            document.getElementById(
                "jalaliCalendar"
            );


        if (calendar) {

            calendar.style.display =
                "none";

        }

    }


    window.closeJalaliCalendar =
        closeCalendar;


    /*
     * جلوگیری از تداخل کلیک
     */

    document.addEventListener(
        "click",
        function (event) {

            const wrapper =
                document.getElementById(
                    "jalaliDateWrapper"
                );

            const calendar =
                document.getElementById(
                    "jalaliCalendar"
                );


            if (
                wrapper &&
                calendar &&
                !wrapper.contains(
                    event.target
                )
            ) {

                closeCalendar();

            }

        }
    );


    /*
     * مقدار اولیه امروز
     */

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            const input =
                document.getElementById(
                    "evaluationDate"
                );


            if (
                input &&
                !input.dataset.value
            ) {

                const today =
                    getTodayJalali();


                const normalized =
                    String(today.year)
                    +
                    "/"
                    +
                    String(today.month)
                        .padStart(2, "0")
                    +
                    "/"
                    +
                    String(today.day)
                        .padStart(2, "0");


                input.dataset.value =
                    normalized;


                input.value =
                    toPersianDigits(
                        normalized
                    );

            }

        }
    );


})();

</script>
