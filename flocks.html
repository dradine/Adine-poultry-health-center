<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#173f35"
    >

    <title>
        سالن و گله | مرکز تخصصی سلامت طیور آدینه
    </title>

    <link
        rel="stylesheet"
        href="app.css"
    >

</head>


<body>

<div class="app-shell">


    <!-- TOP BAR -->

    <header class="topbar">

        <div class="brand">

            <img
                src="IMG_4309.png"
                alt="مرکز تخصصی سلامت طیور آدینه"
            >

            <span>
                سالن و گله
            </span>

        </div>


        <button
            type="button"
            class="btn btn-secondary"
            onclick="location.href='Dashboard.html'"
        >
            داشبورد
        </button>

    </header>


    <!-- MAIN -->

    <main class="page">

        <div class="container">


            <h1 class="page-title">
                مدیریت سالن و گله
            </h1>


            <p class="page-description">
                ابتدا فارم و سالن را انتخاب کنید، سپس دوره گله را ثبت کنید.
            </p>


            <!-- CURRENT FARM -->

            <section class="card">

                <h2 class="card-title">
                    فارم انتخاب‌شده
                </h2>


                <div id="selectedFarm">

                    در حال بارگذاری...

                </div>

            </section>


            <!-- HOUSE FORM -->

            <section class="card">

                <h2 class="card-title">
                    ثبت سالن
                </h2>


                <form id="houseForm">

                    <div class="form-grid">


                        <div class="form-group">

                            <label for="houseName">
                                نام سالن *
                            </label>

                            <input
                                id="houseName"
                                type="text"
                                required
                                placeholder="مثلاً سالن ۱"
                            >

                        </div>


                        <div class="form-group">

                            <label for="houseCode">
                                کد سالن
                            </label>

                            <input
                                id="houseCode"
                                type="text"
                                placeholder="مثلاً H01"
                            >

                        </div>


                        <div class="form-group">

                            <label for="houseCapacity">
                                ظرفیت سالن
                            </label>

                            <input
                                id="houseCapacity"
                                type="number"
                                min="0"
                                inputmode="numeric"
                                placeholder="مثلاً 25000"
                            >

                        </div>


                        <div class="form-group">

                            <label for="houseLength">
                                طول سالن (متر)
                            </label>

                            <input
                                id="houseLength"
                                type="number"
                                min="0"
                                step="0.1"
                            >

                        </div>


                        <div class="form-group">

                            <label for="houseWidth">
                                عرض سالن (متر)
                            </label>

                            <input
                                id="houseWidth"
                                type="number"
                                min="0"
                                step="0.1"
                            >

                        </div>


                        <div class="form-group">

                            <label for="houseVentilation">
                                سیستم تهویه
                            </label>

                            <select id="houseVentilation">

                                <option value="">
                                    انتخاب کنید
                                </option>

                                <option value="tunnel">
                                    تونلی
                                </option>

                                <option value="cross">
                                    عرضی
                                </option>

                                <option value="natural">
                                    طبیعی
                                </option>

                                <option value="mixed">
                                    ترکیبی
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="houseSystem">
                                سیستم پرورش
                            </label>

                            <select id="houseSystem">

                                <option value="">
                                    انتخاب کنید
                                </option>

                                <option value="floor">
                                    بستر
                                </option>

                                <option value="cage">
                                    قفس
                                </option>

                                <option value="aviary">
                                    آویاری
                                </option>

                            </select>

                        </div>


                        <div class="form-group full">

                            <label for="houseNotes">
                                توضیحات
                            </label>

                            <textarea
                                id="houseNotes"
                                rows="3"
                            ></textarea>

                        </div>

                    </div>


                    <div class="button-row">

                        <button
                            class="btn btn-primary"
                            type="submit"
                        >
                            ذخیره سالن
                        </button>

                    </div>

                </form>

            </section>


            <!-- HOUSES -->

            <section class="card">

                <h2 class="card-title">
                    سالن‌های فارم
                </h2>


                <div id="housesList">

                    در حال بارگذاری...

                </div>

            </section>


            <!-- FLOCK FORM -->

            <section class="card">

                <h2 class="card-title">
                    ثبت گله
                </h2>


                <form id="flockForm">

                    <div class="form-grid">


                        <div class="form-group full">

                            <label for="flockHouse">
                                سالن *
                            </label>

                            <select
                                id="flockHouse"
                                required
                            >

                                <option value="">
                                    ابتدا سالن را انتخاب کنید
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="flockName">
                                نام گله *
                            </label>

                            <input
                                id="flockName"
                                type="text"
                                required
                                placeholder="مثلاً گله تابستان ۱۴۰۵"
                            >

                        </div>


                        <div class="form-group">

                            <label for="flockCode">
                                کد گله
                            </label>

                            <input
                                id="flockCode"
                                type="text"
                                placeholder="مثلاً FLOCK-01"
                            >

                        </div>


                        <div class="form-group">

                            <label for="productionType">
                                نوع پرورش *
                            </label>

                            <select
                                id="productionType"
                                required
                            >

                                <option value="">
                                    انتخاب کنید
                                </option>

                                <option value="broiler">
                                    گوشتی
                                </option>

                                <option value="layer">
                                    تخم‌گذار
                                </option>

                                <option value="pullet">
                                    پولت
                                </option>

                                <option value="breeder">
                                    مرغ مادر
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="genetics">
                                نژاد / سویه
                            </label>

                            <select id="genetics">

                                <option value="">
                                    ابتدا نوع پرورش را انتخاب کنید
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="flockProgram">
                                برنامه / کاتالوگ
                            </label>

                            <select id="flockProgram">

                                <option value="">
                                    انتخاب خودکار
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="flockSex">
                                جنسیت
                            </label>

                            <select id="flockSex">

                                <option value="mixed">
                                    مخلوط
                                </option>

                                <option value="male">
                                    نر
                                </option>

                                <option value="female">
                                    ماده
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="birdCount">
                                تعداد اولیه جوجه / مرغ
                            </label>

                            <input
                                id="birdCount"
                                type="number"
                                min="0"
                                inputmode="numeric"
                            >

                        </div>


                        <div class="form-group">

                            <label for="placementDate">
                                تاریخ ورود گله
                            </label>

                            <input
                                id="placementDate"
                                type="date"
                            >

                        </div>


                        <div class="form-group">

                            <label for="startAgeDays">
                                سن در زمان ورود (روز)
                            </label>

                            <input
                                id="startAgeDays"
                                type="number"
                                min="0"
                                value="1"
                            >

                        </div>


                        <div class="form-group full">

                            <label for="flockNotes">
                                توضیحات
                            </label>

                            <textarea
                                id="flockNotes"
                                rows="3"
                            ></textarea>

                        </div>

                    </div>


                    <div class="button-row">

                        <button
                            class="btn btn-primary"
                            type="submit"
                        >
                            ذخیره گله
                        </button>

                    </div>

                </form>

            </section>


            <!-- FLOCKS -->

            <section class="card">

                <h2 class="card-title">
                    گله‌های ثبت‌شده
                </h2>


                <div id="flocksList">

                    در حال بارگذاری...

                </div>

            </section>


        </div>

    </main>


    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

        <button
            type="button"
            onclick="location.href='Dashboard.html'"
        >
            🏠
            <br>
            خانه
        </button>


        <button
            type="button"
            onclick="location.href='Farms.html'"
        >
            🏭
            <br>
            فارم‌ها
        </button>


        <button
            class="active"
            type="button"
            onclick="location.href='flocks.html'"
        >
            🐔
            <br>
            گله
        </button>


        <button
            type="button"
            onclick="location.href='weekly.html'"
        >
            ⚖️
            <br>
            هفتگی
        </button>

    </nav>

</div>


<!-- SUPABASE -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script src="supabase-config.js"></script>


<!-- CORE -->

<script src="standards.js"></script>
<script src="standard-data.js"></script>
<script src="poultry-utils.js"></script>
<script src="weekly-storage.js"></script>
<script src="comparison-engine.js"></script>
<script src="app-core.js"></script>
<script src="genetics-ui.js"></script>
<script src="weekly-engine.js"></script>


<!-- FLOCKS -->

<script src="flocks.js"></script>

</body>

</html>
