<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#173f35"
>

<title>
ثبت هفتگی | مرکز تخصصی سلامت طیور آدینه
</title>

<link
    rel="stylesheet"
    href="app.css"
>

</head>


<body>

<header class="topbar">

    <div class="brand">

        <img
            src="IMG_4309.png"
            alt="آدینه"
        >

        <span>
            پایش هفتگی گله
        </span>

    </div>

    <button
        class="btn btn-secondary"
        onclick="location.href='Dashboard.html'"
    >
        داشبورد
    </button>

</header>


<main class="page">

<div class="container">


<h1 class="page-title">
پایش هفتگی گله
</h1>


<p
    id="flockInfo"
    class="page-description"
></p>



<section class="card">

<h2 class="card-title">
اطلاعات هفته
</h2>


<form id="weeklyForm">


<div class="form-grid">


<div class="form-group">

<label>
تاریخ ارزیابی
</label>

<input
    id="recordDate"
    type="date"
    required
>

</div>


<div class="form-group">

<label>
سن گله (روز)
</label>

<input
    id="ageDays"
    type="number"
    min="0"
    required
>

</div>


<div class="form-group">

<label>
تعداد زنده
</label>

<input
    id="liveBirds"
    type="number"
    min="0"
>

</div>


<div class="form-group">

<label>
وزن متوسط (گرم)
</label>

<input
    id="averageWeight"
    type="number"
    min="0"
    step="0.1"
    required
>

</div>


<div class="form-group">

<label>
انحراف معیار (گرم)
</label>

<input
    id="sd"
    type="number"
    min="0"
    step="0.1"
>

</div>


<div class="form-group">

<label>
CV (%)
</label>

<input
    id="cv"
    type="number"
    min="0"
    step="0.01"
>

</div>


<div class="form-group">

<label>
یکنواختی ±10%
</label>

<input
    id="uniformity10"
    type="number"
    min="0"
    max="100"
    step="0.1"
>

</div>


<div class="form-group">

<label>
یکنواختی ±15%
</label>

<input
    id="uniformity15"
    type="number"
    min="0"
    max="100"
    step="0.1"
>

</div>


<div class="form-group">

<label>
حداقل وزن
</label>

<input
    id="minWeight"
    type="number"
    min="0"
>

</div>


<div class="form-group">

<label>
حداکثر وزن
</label>

<input
    id="maxWeight"
    type="number"
    min="0"
>

</div>


<div class="form-group">

<label>
مصرف دان روزانه
</label>

<input
    id="feed"
    type="number"
    min="0"
    step="0.1"
    placeholder="کیلوگرم"
>

</div>


<div class="form-group">

<label>
مصرف آب روزانه
</label>

<input
    id="water"
    type="number"
    min="0"
    step="0.1"
    placeholder="لیتر"
>

</div>


<div class="form-group">

<label>
تلفات هفتگی
</label>

<input
    id="mortality"
    type="number"
    min="0"
>

</div>


<div class="form-group">

<label>
حذف / حذفی
</label>

<input
    id="culls"
    type="number"
    min="0"
>

</div>


<div class="form-group full">

<label>
توضیحات
</label>

<textarea
    id="notes"
></textarea>

</div>


</div>


<div class="button-row">

<button
    class="btn btn-primary"
    type="submit"
>
محاسبه و ذخیره
</button>

</div>


</form>

</section>



<section
    id="calculation"
    class="card"
>

<h2 class="card-title">
نتیجه محاسبات
</h2>


<div
    id="resultGrid"
    class="stats-grid"
></div>

</section>



<section class="card">

<h2 class="card-title">
سوابق هفتگی
</h2>


<div class="table-wrapper">

<table class="data-table">

<thead>

<tr>

<th>
هفته
</th>

<th>
سن
</th>

<th>
وزن
</th>

<th>
CV
</th>

<th>
یکنواختی ±10
</th>

<th>
دان
</th>

<th>
آب
</th>

<th>
عملیات
</th>

</tr>

</thead>


<tbody
    id="weeklyTable"
></tbody>

</table>

</div>

</section>


</div>

</main>


<script src="app-core.js"></script>
<script src="standard-data.js"></script>
<script src="standards.js"></script>
<script src="poultry-utils.js"></script>
<script src="weekly-storage.js"></script>
<script src="comparison-engine.js"></script>
<script src="genetics-ui.js"></script>
<script src="weekly-engine.js"></script>


<script>

const selection =
    getCurrentSelection();


if (!selection.flockId) {

    location.href =
        "flocks.html";

}


const flock =
    getFlocks()
        .find(
            x =>
                x.id ===
                selection.flockId
        );


if (!flock) {

    location.href =
        "flocks.html";

}


const farm =
    getFarms()
        .find(
            x =>
                x.id ===
                flock.farmId
        );


const house =
    getHouses()
        .find(
            x =>
                x.id ===
                flock.houseId
        );


document.getElementById(
    "flockInfo"
).textContent =

    `${farm?.name || ""} | ` +
    `${house?.name || ""} | ` +
    `${flock.flockName} | ` +
    `${flock.strain}`;



document.getElementById(
    "recordDate"
).value =
    todayISO();



/* =====================================================
   AUTO AGE
===================================================== */

document.getElementById(
    "recordDate"
).addEventListener(
    "change",
    updateAge
);


function updateAge() {

    const age =
        calculateAgeDays(
            flock.placementDate,
            document.getElementById(
                "recordDate"
            ).value
        );


    if (
        age !== null
    ) {

        document.getElementById(
            "ageDays"
        ).value =
            age;

    }

}


updateAge();



/* =====================================================
   CALCULATE
===================================================== */

function calculateWeekly() {

    const weight =
        Number(
            document.getElementById(
                "averageWeight"
            ).value || 0
        );


    const sd =
        Number(
            document.getElementById(
                "sd"
            ).value || 0
        );


    let cv =
        Number(
            document.getElementById(
                "cv"
            ).value || 0
        );


    if (
        !cv &&
        weight &&
        sd
    ) {

        cv =
            (sd / weight) *
            100;

    }


    document.getElementById(
        "cv"
    ).value =
        cv
            ? cv.toFixed(2)
            : "";


    return {

        weight,
        sd,
        cv

    };

}



/* =====================================================
   SAVE
===================================================== */

document.getElementById(
    "weeklyForm"
).addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const calc =
            calculateWeekly();


        const record = {

            farmId:
                flock.farmId,

            houseId:
                flock.houseId,

            flockId:
                flock.id,

            date:
                document.getElementById(
                    "recordDate"
                ).value,

            ageDays:
                Number(
                    document.getElementById(
                        "ageDays"
                    ).value || 0
                ),

            liveBirds:
                Number(
                    document.getElementById(
                        "liveBirds"
                    ).value || 0
                ),

            averageWeight:
                calc.weight,

            sd:
                calc.sd,

            cv:
                calc.cv,

            uniformity10:
                Number(
                    document.getElementById(
                        "uniformity10"
                    ).value || 0
                ),

            uniformity15:
                Number(
                    document.getElementById(
                        "uniformity15"
                    ).value || 0
                ),

            minWeight:
                Number(
                    document.getElementById(
                        "minWeight"
                    ).value || 0
                ),

            maxWeight:
                Number(
                    document.getElementById(
                        "maxWeight"
                    ).value || 0
                ),

            feed:
                Number(
                    document.getElementById(
                        "feed"
                    ).value || 0
                ),

            water:
                Number(
                    document.getElementById(
                        "water"
                    ).value || 0
                ),

            mortality:
                Number(
                    document.getElementById(
                        "mortality"
                    ).value || 0
                ),

            culls:
                Number(
                    document.getElementById(
                        "culls"
                    ).value || 0
                ),

            notes:
                document.getElementById(
                    "notes"
                ).value

        };


        saveWeeklyRecord(
            record
        );


        renderWeekly();


        alert(
            "اطلاعات هفتگی ذخیره شد."
        );

    }
);



/* =====================================================
   RENDER
===================================================== */

function renderWeekly() {

    const records =
        getFlockWeeklyRecords(
            flock.id
        );


    const table =
        document.getElementById(
            "weeklyTable"
        );


    if (!records.length) {

        table.innerHTML = `

            <tr>

                <td colspan="8">
                    هنوز اطلاعاتی ثبت نشده است.
                </td>

            </tr>

        `;

        return;

    }


    table.innerHTML =

        records
            .map(
                (
                    record,
                    index
                ) => `

                    <tr>

                        <td>
                            ${index + 1}
                        </td>

                        <td>
                            ${Number(
                                record.ageDays || 0
                            ).toLocaleString(
                                "fa-IR"
                            )}
                        </td>

                        <td>
                            ${Number(
                                record.averageWeight || 0
                            ).toLocaleString(
                                "fa-IR"
                            )}
                        </td>

                        <td>
                            ${Number(
                                record.cv || 0
                            ).toFixed(2)}
                        </td>

                        <td>
                            ${Number(
                                record.uniformity10 || 0
                            ).toFixed(1)}
                        </td>

                        <td>
                            ${Number(
                                record.feed || 0
                            )}
                        </td>

                        <td>
                            ${Number(
                                record.water || 0
                            )}
                        </td>

                        <td>

                            <button
                                class="btn btn-danger"
                                onclick="
                                    removeWeekly(
                                        '${record.id}'
                                    )
                                "
                            >
                                حذف
                            </button>

                        </td>

                    </tr>

                `
            )
            .join("");

}



function removeWeekly(
    id
) {

    if (
        !confirm(
            "این رکورد حذف شود؟"
        )
    ) {

        return;

    }


    deleteWeeklyRecord(
        id
    );


    renderWeekly();

}


renderWeekly();

</script>


</body>

</html>
