    <style>
        /* =====================================================
           تقویم شمسی
        ===================================================== */

        .jalali-date-wrapper {
            position: relative;
            width: 100%;
        }

        #evaluationDate {
            width: 100%;
            box-sizing: border-box;
            padding-left: 48px;
            cursor: pointer;
            direction: ltr;
            text-align: center;
            font-size: 16px;
        }

        .jalali-calendar-button {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 10px;
            background: #173f35;
            color: white;
            font-size: 19px;
            cursor: pointer;
            z-index: 2;
        }

        .jalali-calendar {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 100%;
            max-width: 360px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0,0,0,.18);
            border: 1px solid #e5e5e5;
            overflow: hidden;
            z-index: 99999;
        }

        .jalali-calendar-header {
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            background: #173f35;
            color: white;
        }

        .jalali-month-title {
            font-size: 15px;
            font-weight: bold;
        }

        .jalali-nav-button {
            width: 42px;
            height: 42px;
            border: 0;
            background: transparent;
            color: white;
            font-size: 28px;
            cursor: pointer;
            border-radius: 10px;
        }

        .jalali-nav-button:active {
            background: rgba(255,255,255,.15);
        }

        .jalali-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            padding: 12px 10px 6px;
            color: #777;
            font-size: 12px;
            text-align: center;
            font-weight: bold;
        }

        .jalali-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            padding: 8px 10px 12px;
        }

        .jalali-day {
            width: 100%;
            aspect-ratio: 1;
            border: 0;
            border-radius: 10px;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
            color: #222;
        }

        .jalali-day:hover {
            background: #edf4f1;
        }

        .jalali-day.today {
            border: 2px solid #173f35;
            font-weight: bold;
        }

        .jalali-day.selected {
            background: #173f35;
            color: white;
            font-weight: bold;
        }

        .jalali-day.today.selected {
            border-color: #173f35;
        }

        .jalali-calendar-footer {
            border-top: 1px solid #eee;
            padding: 10px;
            text-align: center;
        }

        .jalali-today-button {
            border: 0;
            background: transparent;
            color: #173f35;
            font-weight: bold;
            cursor: pointer;
            padding: 7px 20px;
            border-radius: 8px;
        }

        .jalali-today-button:hover {
            background: #edf4f1;
        }

        @media (max-width: 480px) {
            .jalali-calendar {
                max-width: none;
            }
        }

<!-- =====================================================
     تقویم شمسی
     بدون کتابخانه خارجی
     ===================================================== -->

<script>

(function () {

    "use strict";

    const monthNames = [
        "فروردین",
        "اردیبهشت",
        "خرداد",
        "تیر",
        "مرداد",
        "شهریور",
        "مهر",
        "آبان",
        "آذر",
        "دی",
        "بهمن",
        "اسفند"
    ];

    let calendarYear = 1405;
    let calendarMonth = 1;


    function toPersianDigits(value) {

        return String(value).replace(
            /\d/g,
            function (digit) {
                return "۰۱۲۳۴۵۶۷۸۹"[Number(digit)];
            }
        );

    }


    function normalizeDigits(value) {

        return String(value || "")
            .replace(
                /[۰-۹]/g,
                function (digit) {
                    return String(
                        digit.charCodeAt(0) - 1776
                    );
                }
            )
            .replace(
                /[٠-٩]/g,
                function (digit) {
                    return String(
                        digit.charCodeAt(0) - 1632
                    );
                }
            );

    }


    /*
     * استفاده از تقویم فارسی داخلی مرورگر
     * برای تبدیل دقیق تاریخ امروز
     */

    function getTodayJalali() {

        const now = new Date();

        const formatter =
            new Intl.DateTimeFormat(
                "en-US-u-ca-persian",
                {
                    year: "numeric",
                    month: "numeric",
                    day: "numeric"
                }
            );

        const parts =
            formatter.formatToParts(now);

        return {

            year: Number(
                parts.find(
                    p => p.type === "year"
                ).value
            ),

            month: Number(
                parts.find(
                    p => p.type === "month"
                ).value
            ),

            day: Number(
                parts.find(
                    p => p.type === "day"
                ).value
            )

        };

    }


    /*
     * تعداد روزهای ماه
     */

    function daysInJalaliMonth(
        year,
        month
    ) {

        if (month <= 6) {
            return 31;
        }

        if (month <= 11) {
            return 30;
        }

        /*
         * تشخیص اسفند با مقایسه
         * اول فروردین سال بعد
         */

        const current =
            jalaliToGregorian(
                year,
                12,
                1
            );

        const next =
            jalaliToGregorian(
                year + 1,
                1,
                1
            );

        const currentDate =
            new Date(
                current.gy,
                current.gm - 1,
                current.gd
            );

        const nextDate =
            new Date(
                next.gy,
                next.gm - 1,
                next.gd
            );

        const diff =
            Math.round(
                (
                    nextDate -
                    currentDate
                ) /
                86400000
            );

        return diff;

    }


    /*
     * تبدیل جلالی به میلادی
     */

    function jalaliToGregorian(
        jy,
        jm,
        jd
    ) {

        let gy =
            jy + 621;

        const breaks = [
            -61, 9, 38, 199, 426, 686,
            756, 818, 1111, 1181, 1210,
            1635, 2060, 2097, 2192, 2262,
            2324, 2394, 2456, 3178
        ];

        let leapJ = -14;

        let jp = breaks[0];

        let jump = 0;

        for (
            let i = 1;
            i < breaks.length;
            i++
        ) {

            const jm2 = breaks[i];

            jump = jm2 - jp;

            if (jy < jm2) {
                break;
            }

            leapJ +=
                Math.floor(jump / 33) * 8 +
                Math.floor((jump % 33) / 4);

            jp = jm2;

        }

        let n =
            jy - jp;

        if (n === jump) {

            leapJ +=
                Math.floor(jump / 33);

        }

        let leapG =
            Math.floor(gy / 4) -
            Math.floor(
                (
                    Math.floor(gy / 100) + 1
                ) * 3 / 4
            ) -
            150;

        let march =
            20 +
            leapJ -
            leapG;

        let days;

        if (jm <= 6) {

            days =
                (jm - 1) * 31 +
                (jd - 1);

        } else {

            days =
                186 +
                (jm - 7) * 30 +
                (jd - 1);

        }

        const date =
            new Date(
                gy,
                2,
                march
            );

        date.setDate(
            date.getDate() +
            days
        );

        return {

            gy: date.getFullYear(),
            gm: date.getMonth() + 1,
            gd: date.getDate()

        };

    }


    /*
     * تبدیل میلادی به جلالی
     */

    function gregorianToJalali(
        gy,
        gm,
        gd
    ) {

        const gdm = [
            0, 31, 59, 90, 120, 151,
            181, 212, 243, 273, 304, 334
        ];

        let gy2 =
            gm > 2
                ? gy + 1
                : gy;

        let days =
            355666 +
            (365 * gy) +
            Math.floor(
                (gy2 + 3) / 4
            ) -
            Math.floor(
                (gy2 + 99) / 100
            ) +
            Math.floor(
                (gy2 + 399) / 400
            ) +
            gd +
            gdm[gm - 1];

        let jy =
            -1595 +
            33 *
            Math.floor(
                days / 12053
            );

        days %= 12053;

        jy +=
            4 *
            Math.floor(
                days / 1461
            );

        days %= 1461;

        if (days > 365) {

            jy +=
                Math.floor(
                    (days - 1) / 365
                );

            days =
                (days - 1) % 365;

        }

        let jm;

        if (days < 186) {

            jm =
                1 +
                Math.floor(
                    days / 31
                );

        } else {

            jm =
                7 +
                Math.floor(
                    (days - 186) / 30
                );

        }

        let jd;

        if (days < 186) {

            jd =
                1 +
                (days % 31);

        } else {

            jd =
                1 +
                (
                    (days - 186) % 30
                );

        }

        return {
            year: jy,
            month: jm,
            day: jd
        };

    }


    function renderCalendar() {

        const days =
            document.getElementById(
                "jalaliDays"
            );

        const title =
            document.getElementById(
                "jalaliMonthTitle"
            );

        if (!days || !title) {
            return;
        }

        title.textContent =
            monthNames[
                calendarMonth - 1
            ] +
            " " +
            toPersianDigits(
                calendarYear
            );

        days.innerHTML = "";


        /*
         * روز اول ماه
         */

        const first =
            jalaliToGregorian(
                calendarYear,
                calendarMonth,
                1
            );

        const firstDate =
            new Date(
                first.gy,
                first.gm - 1,
                first.gd
            );


        /*
         * JS:
         * Sunday = 0
         * Monday = 1
         * ...
         * Saturday = 6
         *
         * تقویم ما:
         * Saturday = 0
         */

        const start =
            (
                firstDate.getDay() + 1
            ) % 7;


        for (
            let i = 0;
            i < start;
            i++
        ) {

            const empty =
                document.createElement(
                    "div"
                );

            days.appendChild(
                empty
            );

        }


        const total =
            daysInJalaliMonth(
                calendarYear,
                calendarMonth
            );


        const today =
            getTodayJalali();


        const input =
            document.getElementById(
                "evaluationDate"
            );


        const selected =
            normalizeDigits(
                input?.value || ""
            ).split("/");


        const selectedYear =
            Number(selected[0]);

        const selectedMonth =
            Number(selected[1]);

        const selectedDay =
            Number(selected[2]);


        for (
            let day = 1;
            day <= total;
            day++
        ) {

            const button =
                document.createElement(
                    "button"
                );

            button.type = "button";

            button.className =
                "jalali-day";

            button.textContent =
                toPersianDigits(
                    day
                );


            if (
                today.year === calendarYear &&
                today.month === calendarMonth &&
                today.day === day
            ) {

                button.classList.add(
                    "today"
                );

            }


            if (
                selectedYear === calendarYear &&
                selectedMonth === calendarMonth &&
                selectedDay === day
            ) {

                button.classList.add(
                    "selected"
                );

            }


            button.addEventListener(
                "click",
                function (event) {

                    event.stopPropagation();

                    selectDate(
                        calendarYear,
                        calendarMonth,
                        day
                    );

                }
            );


            days.appendChild(
                button
            );

        }

    }


    function selectDate(
        year,
        month,
        day
    ) {

        const input =
            document.getElementById(
                "evaluationDate"
            );

        if (!input) {
            return;
        }

        const value =
            String(year) +
            "/" +
            String(month).padStart(2, "0") +
            "/" +
            String(day).padStart(2, "0");


        input.value =
            toPersianDigits(
                value
            );


        closeCalendar();

    }


    function openCalendar() {

        const calendar =
            document.getElementById(
                "jalaliCalendar"
            );

        const input =
            document.getElementById(
                "evaluationDate"
            );


        if (!calendar) {
            return;
        }


        const today =
            getTodayJalali();


        const current =
            normalizeDigits(
                input?.value || ""
            ).split("/");


        if (
            current.length === 3 &&
            Number(current[0]) &&
            Number(current[1])
        ) {

            calendarYear =
                Number(current[0]);

            calendarMonth =
                Number(current[1]);

        } else {

            calendarYear =
                today.year;

            calendarMonth =
                today.month;

        }


        renderCalendar();

        calendar.style.display =
            "block";

    }


    function closeCalendar() {

        const calendar =
            document.getElementById(
                "jalaliCalendar"
            );

        if (calendar) {

            calendar.style.display =
                "none";

        }

    }


    function previousMonth() {

        calendarMonth--;

        if (calendarMonth < 1) {

            calendarMonth = 12;

            calendarYear--;

        }

        renderCalendar();

    }


    function nextMonth() {

        calendarMonth++;

        if (calendarMonth > 12) {

            calendarMonth = 1;

            calendarYear++;

        }

        renderCalendar();

    }


    function today() {

        const value =
            getTodayJalali();

        selectDate(
            value.year,
            value.month,
            value.day
        );

    }


    document.addEventListener(
        "DOMContentLoaded",
        function () {

            const input =
                document.getElementById(
                    "evaluationDate"
                );

            const calendarButton =
                document.getElementById(
                    "jalaliCalendarButton"
                );

            const calendar =
                document.getElementById(
                    "jalaliCalendar"
                );

            const previous =
                document.getElementById(
                    "jalaliPrevButton"
                );

            const next =
                document.getElementById(
                    "jalaliNextButton"
                );

            const todayButton =
                document.getElementById(
                    "jalaliTodayButton"
                );


            if (!input || !calendar) {
                return;
            }


            /*
             * تاریخ امروز فقط اگر خالی باشد
             */

            if (!input.value) {

                const value =
                    getTodayJalali();

                input.value =
                    toPersianDigits(
                        value.year +
                        "/" +
                        String(
                            value.month
                        ).padStart(2, "0") +
                        "/" +
                        String(
                            value.day
                        ).padStart(2, "0")
                    );

            }


            input.addEventListener(
                "click",
                function (event) {

                    event.stopPropagation();

                    openCalendar();

                }
            );


            input.addEventListener(
                "focus",
                function () {

                    openCalendar();

                }
            );


            calendarButton.addEventListener(
                "click",
                function (event) {

                    event.stopPropagation();

                    if (
                        calendar.style.display ===
                        "block"
                    ) {

                        closeCalendar();

                    } else {

                        openCalendar();

                    }

                }
            );


            previous.addEventListener(
                "click",
                function (event) {

                    event.stopPropagation();

                    previousMonth();

                }
            );


            next.addEventListener(
                "click",
                function (event) {

                    event.stopPropagation();

                    nextMonth();

                }
            );


            todayButton.addEventListener(
                "click",
                function (event) {

                    event.stopPropagation();

                    today();

                }
            );


            calendar.addEventListener(
                "click",
                function (event) {

                    event.stopPropagation();

                }
            );


            document.addEventListener(
                "click",
                function (event) {

                    const wrapper =
                        document.getElementById(
                            "jalaliDateWrapper"
                        );

                    if (
                        wrapper &&
                        !wrapper.contains(
                            event.target
                        )
                    ) {

                        closeCalendar();

                    }

                }
            );

        }
    );

})();

</script>
