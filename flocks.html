<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#173f35"
>

<title>
ثبت سالن و گله | مرکز تخصصی سلامت طیور آدینه
</title>

<link
    rel="stylesheet"
    href="app.css"
>

</head>


<body>

<header class="topbar">

    <div class="brand">

        <img
            src="IMG_4309.png"
            alt="آدینه"
        >

        <span>
            ثبت سالن و گله
        </span>

    </div>

    <button
        type="button"
        class="btn btn-secondary"
        onclick="location.href='Dashboard.html'"
    >
        داشبورد
    </button>

</header>


<main class="page">

<div class="container">


<h1 class="page-title">
    ثبت سالن و گله
</h1>


<p
    id="selectedFarm"
    class="page-description"
></p>



<!-- =====================================================
     HOUSE
===================================================== -->

<section class="card">

<h2 class="card-title">
    اطلاعات سالن
</h2>


<form id="houseForm">


<div class="form-grid">


<div class="form-group">

<label for="houseName">
نام سالن
</label>

<input
    id="houseName"
    required
    placeholder="مثلاً سالن ۱"
>

</div>


<div class="form-group">

<label for="houseCode">
کد سالن
</label>

<input
    id="houseCode"
    placeholder="مثلاً H01"
>

</div>


<div class="form-group">

<label for="houseCapacity">
ظرفیت سالن
</label>

<input
    id="houseCapacity"
    type="number"
    min="0"
>

</div>


<div class="form-group">

<label for="houseLength">
طول سالن (متر)
</label>

<input
    id="houseLength"
    type="number"
    min="0"
>

</div>


<div class="form-group">

<label for="houseWidth">
عرض سالن (متر)
</label>

<input
    id="houseWidth"
    type="number"
    min="0"
>

</div>


<div class="form-group">

<label for="housingSystem">
سیستم پرورش
</label>

<select id="housingSystem">

<option value="">
انتخاب کنید
</option>

<option value="floor">
بستر
</option>

<option value="cage">
قفس
</option>

<option value="aviary">
آویاری
</option>

<option value="free_range">
آزاد
</option>

</select>

</div>


<div class="form-group">

<label for="ventilation">
سیستم تهویه
</label>

<input
    id="ventilation"
    placeholder="مثلاً تونلی"
>

</div>


<div class="form-group full">

<label for="houseNotes">
توضیحات سالن
</label>

<textarea
    id="houseNotes"
></textarea>

</div>


</div>


<div class="button-row">

<button
    class="btn btn-primary"
    type="submit"
>
ثبت سالن
</button>

</div>


</form>

</section>



<!-- =====================================================
     FLOCK
===================================================== -->

<section class="card">

<h2 class="card-title">
ثبت گله
</h2>


<form id="flockForm">


<div class="form-grid">


<div class="form-group">

<label for="flockName">
نام گله
</label>

<input
    id="flockName"
    required
    placeholder="مثلاً گله ۱۴۰۵-۰۱"
>

</div>


<div class="form-group">

<label for="flockCode">
کد گله
</label>

<input
    id="flockCode"
    placeholder="مثلاً F140501"
>

</div>


<div class="form-group">

<label for="birdCount">
تعداد اولیه
</label>

<input
    id="birdCount"
    type="number"
    min="1"
    required
>

</div>


<div class="form-group">

<label for="placementDate">
تاریخ ورود گله
</label>

<input
    id="placementDate"
    type="date"
    required
>

</div>


<div class="form-group">

<label for="productionType">
نوع گله
</label>

<select
    id="productionType"
    required
>

<option value="">
انتخاب کنید
</option>

<option value="broiler">
گوشتی
</option>

<option value="layer">
تخم‌گذار
</option>

<option value="pullet">
پولت
</option>

<option value="breeder">
مرغ مادر
</option>

</select>

</div>


<div class="form-group">

<label for="genetics">
ژنتیک / شرکت
</label>

<select
    id="genetics"
    required
>

<option value="">
ابتدا نوع گله را انتخاب کنید
</option>

</select>

</div>


<div class="form-group">

<label for="strain">
سویه
</label>

<select
    id="strain"
    required
>

<option value="">
ابتدا ژنتیک را انتخاب کنید
</option>

</select>

</div>


<div class="form-group">

<label for="standardProgram">
استاندارد مقایسه
</label>

<select
    id="standardProgram"
>

<option value="">
انتخاب خودکار
</option>

</select>

</div>


<div class="form-group">

<label for="sex">
جنسیت
</label>

<select id="sex">

<option value="mixed">
مخلوط
</option>

<option value="male">
نر
</option>

<option value="female">
ماده
</option>

</select>

</div>


<div class="form-group full">

<div
    id="geneticsInfo"
    class="info-box"
></div>

</div>


<div class="form-group full">

<label for="flockNotes">
توضیحات
</label>

<textarea
    id="flockNotes"
></textarea>

</div>


</div>


<div class="button-row">

<button
    class="btn btn-primary"
    type="submit"
>
ثبت گله
</button>

</div>


</form>

</section>



<!-- =====================================================
     HOUSES LIST
===================================================== -->

<section class="card">

<h2 class="card-title">
سالن‌های ثبت‌شده
</h2>


<div id="housesList"></div>

</section>



<!-- =====================================================
     FLOCKS LIST
===================================================== -->

<section class="card">

<h2 class="card-title">
گله‌های این فارم
</h2>


<div id="flocksList"></div>

</section>


</div>

</main>



<script src="app-core.js"></script>
<script src="standard-data.js"></script>
<script src="standards.js"></script>
<script src="poultry-utils.js"></script>
<script src="weekly-storage.js"></script>
<script src="comparison-engine.js"></script>
<script src="genetics-ui.js"></script>
<script src="weekly-engine.js"></script>


<script>

let selection =
    getCurrentSelection();


if (!selection.farmId) {

    location.href =
        "Farms.html";

}


let currentFarm =
    getFarms()
        .find(
            farm =>
                farm.id ===
                selection.farmId
        );


if (!currentFarm) {

    location.href =
        "Farms.html";

}


document.getElementById(
    "selectedFarm"
).textContent =

    "فارم انتخاب‌شده: " +
    currentFarm.name;



/* =====================================================
   INITIALIZATION
===================================================== */

if (
    typeof initGeneticsSelectors ===
    "function"
) {

    initGeneticsSelectors();

}


document.getElementById(
    "placementDate"
).value =
    todayISO();



/* =====================================================
   HOUSE FORM
===================================================== */

document.getElementById(
    "houseForm"
).addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const house =
            saveHouse({

                farmId:
                    currentFarm.id,

                name:
                    document.getElementById(
                        "houseName"
                    ).value,

                code:
                    document.getElementById(
                        "houseCode"
                    ).value,

                capacity:
                    document.getElementById(
                        "houseCapacity"
                    ).value,

                length:
                    document.getElementById(
                        "houseLength"
                    ).value,

                width:
                    document.getElementById(
                        "houseWidth"
                    ).value,

                housingSystem:
                    document.getElementById(
                        "housingSystem"
                    ).value,

                ventilation:
                    document.getElementById(
                        "ventilation"
                    ).value,

                notes:
                    document.getElementById(
                        "houseNotes"
                    ).value

            });


        if (!house) {

            alert(
                "خطا در ذخیره سالن."
            );

            return;

        }


        this.reset();


        renderHouses();


        alert(
            "سالن با موفقیت ثبت شد."
        );

    }
);



/* =====================================================
   FLOCK FORM
===================================================== */

document.getElementById(
    "flockForm"
).addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const houseId =
            document.getElementById(
                "houseSelect"
            )?.value ||
            getFarmHouses(
                currentFarm.id
            )[0]?.id;


        if (!houseId) {

            alert(
                "ابتدا حداقل یک سالن ثبت کنید."
            );

            return;

        }


        const flock =
            saveFlock({

                farmId:
                    currentFarm.id,

                houseId:
                    houseId,

                flockName:
                    document.getElementById(
                        "flockName"
                    ).value,

                flockCode:
                    document.getElementById(
                        "flockCode"
                    ).value,

                birdCount:
                    document.getElementById(
                        "birdCount"
                    ).value,

                placementDate:
                    document.getElementById(
                        "placementDate"
                    ).value,

                productionType:
                    document.getElementById(
                        "productionType"
                    ).value,

                genetics:
                    document.getElementById(
                        "genetics"
                    ).value,

                strain:
                    document.getElementById(
                        "strain"
                    ).value,

                program:
                    document.getElementById(
                        "standardProgram"
                    ).value,

                sex:
                    document.getElementById(
                        "sex"
                    ).value,

                notes:
                    document.getElementById(
                        "flockNotes"
                    ).value

            });


        if (!flock) {

            alert(
                "خطا در ذخیره گله."
            );

            return;

        }


        setCurrentSelection({

            farmId:
                currentFarm.id,

            houseId:
                flock.houseId,

            flockId:
                flock.id

        });


        this.reset();


        document.getElementById(
            "placementDate"
        ).value =
            todayISO();


        renderFlocks();


        alert(
            "گله با موفقیت ثبت شد."
        );

    }
);



/* =====================================================
   HOUSE SELECT
===================================================== */

function refreshHouseSelect() {

    const form =
        document.getElementById(
            "flockForm"
        );


    let old =
        document.getElementById(
            "houseSelect"
        );


    if (!old) {

        const wrapper =
            document.createElement(
                "div"
            );

        wrapper.className =
            "form-group";


        wrapper.innerHTML = `

            <label for="houseSelect">
                سالن گله
            </label>

            <select id="houseSelect">
            </select>

        `;


        const grid =
            form.querySelector(
                ".form-grid"
            );


        grid.insertBefore(
            wrapper,
            grid.firstElementChild
        );


        old =
            document.getElementById(
                "houseSelect"
            );

    }


    const houses =
        getFarmHouses(
            currentFarm.id
        );


    old.innerHTML =

        houses.length

            ? houses
                .map(
                    house => `

                        <option
                            value="${house.id}"
                        >
                            ${escapeHTML(
                                house.name
                            )}
                        </option>

                    `
                )
                .join("")

            : `

                <option value="">
                    ابتدا سالن ثبت کنید
                </option>

            `;

}



/* =====================================================
   RENDER HOUSES
===================================================== */

function renderHouses() {

    const container =
        document.getElementById(
            "housesList"
        );


    const houses =
        getFarmHouses(
            currentFarm.id
        );


    if (!houses.length) {

        container.innerHTML = `

            <div class="empty-state">

                هنوز سالنی ثبت نشده است.

            </div>

        `;

        refreshHouseSelect();

        return;

    }


    container.innerHTML =

        houses
            .map(
                house => {

                    const flockCount =
                        getHouseFlocks(
                            house.id
                        ).length;


                    return `

                        <div class="list-card">

                            <div>

                                <strong>
                                    ${escapeHTML(
                                        house.name
                                    )}
                                </strong>

                                <p>
                                    ظرفیت:
                                    ${house.capacity || "-"}
                                </p>

                                <p>
                                    سیستم:
                                    ${escapeHTML(
                                        house.housingSystem ||
                                        "-"
                                    )}
                                </p>

                                <p>
                                    تعداد گله:
                                    ${flockCount}
                                </p>

                            </div>

                        </div>

                    `;

                }
            )
            .join("");


    refreshHouseSelect();

}



/* =====================================================
   RENDER FLOCKS
===================================================== */

function renderFlocks() {

    const container =
        document.getElementById(
            "flocksList"
        );


    const flocks =
        getFlocks()
            .filter(
                flock =>
                    flock.farmId ===
                    currentFarm.id
            );


    if (!flocks.length) {

        container.innerHTML = `

            <div class="empty-state">

                هنوز گله‌ای ثبت نشده است.

            </div>

        `;

        return;

    }


    container.innerHTML =

        flocks
            .map(
                flock => `

                    <div class="list-card">

                        <div>

                            <strong>
                                ${escapeHTML(
                                    flock.flockName
                                )}
                            </strong>

                            <p>
                                نوع:
                                ${escapeHTML(
                                    flock.productionType
                                )}
                            </p>

                            <p>
                                ژنتیک:
                                ${escapeHTML(
                                    flock.genetics
                                )}
                            </p>

                            <p>
                                سویه:
                                ${escapeHTML(
                                    flock.strain
                                )}
                            </p>

                            <p>
                                تعداد:
                                ${Number(
                                    flock.birdCount || 0
                                ).toLocaleString(
                                    "fa-IR"
                                )}
                            </p>

                        </div>


                        <div class="button-row">

                            <button
                                type="button"
                                class="btn btn-primary"
                                onclick="
                                    openFlock(
                                        '${flock.id}'
                                    )
                                "
                            >
                                ورود به گله
                            </button>

                        </div>

                    </div>

                `
            )
            .join("");

}



/* =====================================================
   OPEN FLOCK
===================================================== */

function openFlock(
    flockId
) {

    const flock =
        getFlocks()
            .find(
                item =>
                    item.id ===
                    flockId
            );


    if (!flock) {

        return;

    }


    setCurrentSelection({

        farmId:
            flock.farmId,

        houseId:
            flock.houseId,

        flockId:
            flock.id

    });


    location.href =
        "weekly.html";

}



/* =====================================================
   START
===================================================== */

renderHouses();

renderFlocks();

</script>


</body>

</html>
